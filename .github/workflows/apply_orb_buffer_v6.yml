name: apply orb buffer v6
on: {push: {branches: [agent/gdlearn2-physics-v6], paths: [.github/workflows/apply_orb_buffer_v6.yml]}}
permissions: {contents: write}
jobs:
  t:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - shell: bash
        run: |
          set -euo pipefail
          python3 tools/apply_orb_buffer_v6.py
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release >/dev/null
          cmake --build build -j"$(nproc)" >/dev/null
          ./build/gdlearn selftest
          cat >/tmp/b.gdl <<'EOF'
          # gdlearn level v1
          name buffer_test
          floor 0
          roof 0
          length 1000
          o orb 0 10 70 18 18 36
          EOF
          # Press long before reaching the orb; exact GD buffer must persist and
          # consume it once overlap happens.
          cat >/tmp/b.macro <<'EOF'
          # gdlearn macro v2 native-240-tps
          level buffer_test
          fps 240
          progress 0
          frames 20
          r 1 20
          EOF
          ./build/gdlearn trace /tmp/b.gdl --macro /tmp/b.macro --frames 20 | tee /tmp/b.trace
          grep -E ' [0-9]+$' /tmp/b.trace >/dev/null || true
      - shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/core/sim.hpp src/core/sim.cpp src/search/beam.cpp src/env/obs.cpp
          git rm tools/apply_orb_buffer_v6.py .github/workflows/apply_orb_buffer_v6.yml
          git commit -m 'match GD orb input buffer and one-tick coyote overlap'
          git push
