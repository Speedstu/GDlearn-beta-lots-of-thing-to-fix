name: demon blocker screens v8
on:
  push:
    branches: [agent/gdlearn2-physics-v6]
    paths:
      - .github/workflows/demon_screens_v8.yml
      - diagnostics/demons_v8/*.macro
permissions: {contents: write}
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - shell: bash
        run: |
          set -euo pipefail
          for f in diagnostics/demons_v8/clubstep.macro diagnostics/demons_v8/toe2.macro diagnostics/demons_v8/deadlocked.macro; do
            if [ ! -f "$f" ]; then echo 'v8 macros not ready'; exit 0; fi
          done
          python3 -m pip install --quiet pillow
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release >/dev/null
          cmake --build build -j2 >/dev/null
          mkdir -p /tmp/ds8 diagnostics/demons_v8/screens
          python3 tools/gmd_to_gdl.py levels/14.gmd -o /tmp/ds8/clubstep.gdl --name Clubstep >/dev/null
          python3 tools/gmd_to_gdl.py levels/18.gmd -o /tmp/ds8/toe2.gdl --name 'Theory of Everything 2' >/dev/null
          python3 tools/gmd_to_gdl.py levels/20.gmd -o /tmp/ds8/deadlocked.gdl --name Deadlocked >/dev/null
          for k in clubstep toe2 deadlocked; do ./build/gdlearn trace "/tmp/ds8/$k.gdl" --macro "diagnostics/demons_v8/$k.macro" --frames 50000 > "/tmp/ds8/$k.trace" || true; done
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image,ImageDraw
          import math,re
          OUT=Path('diagnostics/demons_v8/screens'); OUT.mkdir(parents=True,exist_ok=True)
          specs=[('clubstep','Clubstep'),('toe2','Theory of Everything 2'),('deadlocked','Deadlocked')]
          cols={'solid':(105,115,145),'hazard':(230,70,80),'pad':(225,190,65),'orb':(75,195,230),'portal':(180,95,225),'speed':(85,210,130)}
          rx=re.compile(r'^\s*(\d+)\s+(HOLD|\.\.\.\.)\s+([\d.-]+)\s+([\d.-]+)\s+([\d.-]+)\s+(\d+)\s+(\d+)\s+(\d+)\s+(\d+)\s+(-?\d+)\s+(-?\d+)\s+(-?\d+)\s+(-?\d+)')
          def trace(path):
            a=[]
            for l in Path(path).read_text().splitlines():
              m=rx.match(l)
              if m:a.append(dict(frame=int(m[1]),hold=m[2]=='HOLD',x=float(m[3])*30,y=float(m[4])*30,vy=float(m[5]),ground=int(m[6]),dead=int(m[7]),mode=int(m[8]),flip=int(m[9]),pad=int(m[10]),orb=int(m[11]),contact=int(m[12]),death=int(m[13])))
            return a
          def objs(path):
            a=[]
            for l in Path(path).read_text().splitlines():
              p=l.split()
              if len(p)>=8 and p[0]=='o':a.append(dict(uid=len(a),kind=p[1],sub=int(p[2]),x=float(p[3]),y=float(p[4]),hw=float(p[5]),hh=float(p[6]),id=int(p[7]),rot=float(p[8]) if len(p)>8 else 0.0))
            return a
          def corners(o):
            r=math.radians(o['rot']); c=math.cos(r); s=math.sin(r); pts=[]
            for x,y in [(-o['hw'],-o['hh']),(o['hw'],-o['hh']),(o['hw'],o['hh']),(-o['hw'],o['hh'])]:pts.append((o['x']+x*c-y*s,o['y']+x*s+y*c))
            return pts
          report=[]
          for key,name in specs:
            rs=trace(f'/tmp/ds8/{key}.trace'); os=objs(f'/tmp/ds8/{key}.gdl')
            if not rs: continue
            end=next((r for r in rs if r['dead']),rs[-1]); cx,cy=end['x'],end['y']; W,H,S=1400,820,2.0; x0=cx-W/S*.48; y0=cy-H/S*.5
            sx=lambda x:int((x-x0)*S); sy=lambda y:int(H-(y-y0)*S)
            im=Image.new('RGB',(W,H),(15,17,24)); d=ImageDraw.Draw(im)
            for o in os:
              if abs(o['x']-cx)>W/S*.55 or abs(o['y']-cy)>H/S*.6:continue
              col=cols.get(o['kind'],(130,130,130))
              if abs(o['rot'])>1e-4 and o['kind'] in ('portal','speed'):
                d.polygon([(sx(x),sy(y)) for x,y in corners(o)],outline=col,width=2)
              elif o['kind']=='hazard' and o['sub']==1:
                d.ellipse((sx(o['x']-o['hw']),sy(o['y']+o['hh']),sx(o['x']+o['hw']),sy(o['y']-o['hh'])),outline=col,width=2)
              else:d.rectangle((sx(o['x']-o['hw']),sy(o['y']+o['hh']),sx(o['x']+o['hw']),sy(o['y']-o['hh'])),outline=col,width=2)
              if abs(o['x']-cx)<150 and abs(o['y']-cy)<130:d.text((sx(o['x']),sy(o['y'])),f"u{o['uid']} id{o['id']}",fill=(205,205,215))
            trail=[r for r in rs if r['frame']<=end['frame']][-360:]; pts=[(sx(r['x']),sy(r['y'])) for r in trail]
            if len(pts)>1:d.line(pts,fill=(70,225,155),width=3)
            half=(3 if end['mode']==4 else (9 if False else 15))
            if end['mode']==4: half=3 if False else 5
            d.rectangle((sx(cx-half),sy(cy+half),sx(cx+half),sy(cy-half)),outline=(255,255,255),width=4)
            killer=os[end['death']] if 0<=end['death']<len(os) else None
            desc='world/uninstrumented' if killer is None else f"uid={killer['uid']} id={killer['id']} {killer['kind']} sub={killer['sub']} rot={killer['rot']:.1f}"
            d.rectangle((0,0,W,36),fill=(20,23,32)); d.text((12,10),f"{name} frame={end['frame']} x={cx/30:.2f}bl mode={end['mode']} dead={end['dead']} | {desc}",fill=(245,245,250))
            im.save(OUT/f'{key}.png'); report += [f'[{name}] {desc}',f'end={end}','']
          (OUT/'report.txt').write_text('\n'.join(report)); print('\n'.join(report))
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add diagnostics/demons_v8/screens
          git commit -m 'add v8 visual blocker diagnostics' || true
          git push
