name: fast v8 blocker screens
on:
  push:
    branches: [agent/gdlearn2-physics-v6]
    paths:
      - .github/workflows/demon_screens_v8_fast.yml
      - diagnostics/demons_v8_fast/*.macro
permissions: {contents: write}
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - shell: bash
        run: |
          set -euo pipefail
          for f in diagnostics/demons_v8_fast/clubstep.macro diagnostics/demons_v8_fast/toe2.macro diagnostics/demons_v8_fast/deadlocked.macro; do [ -f "$f" ] || { echo 'fast macros missing'; exit 0; }; done
          python3 -m pip install --quiet pillow
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release >/dev/null
          cmake --build build -j2 >/dev/null
          mkdir -p /tmp/dsf diagnostics/demons_v8_fast/screens
          python3 tools/gmd_to_gdl.py levels/14.gmd -o /tmp/dsf/clubstep.gdl --name Clubstep >/dev/null
          python3 tools/gmd_to_gdl.py levels/18.gmd -o /tmp/dsf/toe2.gdl --name 'Theory of Everything 2' >/dev/null
          python3 tools/gmd_to_gdl.py levels/20.gmd -o /tmp/dsf/deadlocked.gdl --name Deadlocked >/dev/null
          for k in clubstep toe2 deadlocked; do ./build/gdlearn trace "/tmp/dsf/$k.gdl" --macro "diagnostics/demons_v8_fast/$k.macro" --frames 50000 > "/tmp/dsf/$k.trace" || true; done
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image,ImageDraw
          import math
          out=Path('diagnostics/demons_v8_fast/screens'); out.mkdir(parents=True,exist_ok=True)
          specs=[('clubstep','Clubstep'),('toe2','Theory of Everything 2'),('deadlocked','Deadlocked')]
          colors={'solid':(105,115,145),'hazard':(235,70,80),'pad':(225,190,65),'orb':(75,195,230),'portal':(185,95,230),'speed':(85,210,130)}
          def read_trace(path):
            rows=[]
            for line in Path(path).read_text().splitlines():
              p=line.split()
              if len(p)<13 or not p[0].isdigit(): continue
              rows.append(dict(frame=int(p[0]),hold=p[1]=='HOLD',x=float(p[2])*30,y=float(p[3])*30,vy=float(p[4]),ground=int(p[5]),dead=int(p[6]),mode=int(p[7]),flip=int(p[8]),pad=int(p[9]),orb=int(p[10]),contact=int(p[11]),death=int(p[12]),mini=int(p[13]) if len(p)>13 else 0,tier=int(p[14]) if len(p)>14 else 1))
            return rows
          def read_objs(path):
            a=[]
            for line in Path(path).read_text().splitlines():
              p=line.split()
              if len(p)>=8 and p[0]=='o': a.append(dict(uid=len(a),kind=p[1],sub=int(p[2]),x=float(p[3]),y=float(p[4]),hw=float(p[5]),hh=float(p[6]),id=int(p[7]),rot=float(p[8]) if len(p)>8 else 0.0))
            return a
          def corners(o):
            r=math.radians(o['rot']);c=math.cos(r);s=math.sin(r)
            return [(o['x']+x*c-y*s,o['y']+x*s+y*c) for x,y in [(-o['hw'],-o['hh']),(o['hw'],-o['hh']),(o['hw'],o['hh']),(-o['hw'],o['hh'])]]
          report=[]
          for key,name in specs:
            rs=read_trace(f'/tmp/dsf/{key}.trace'); os=read_objs(f'/tmp/dsf/{key}.gdl')
            end=next((r for r in rs if r['dead']),rs[-1]); cx,cy=end['x'],end['y']
            W,H,S=1440,900,2.5; spanx=W/S; spany=H/S; x0=cx-spanx*.45; y0=cy-spany*.5
            sx=lambda x:int((x-x0)*S); sy=lambda y:int(H-(y-y0)*S)
            im=Image.new('RGB',(W,H),(14,16,23));d=ImageDraw.Draw(im)
            for gx in range(math.floor(x0/30)*30,math.ceil((x0+spanx)/30)*30+1,30): d.line((sx(gx),0,sx(gx),H),fill=(28,31,43))
            for gy in range(math.floor(y0/30)*30,math.ceil((y0+spany)/30)*30+1,30): d.line((0,sy(gy),W,sy(gy)),fill=(28,31,43))
            nearby=[]
            for o in os:
              if abs(o['x']-cx)>spanx*.58 or abs(o['y']-cy)>spany*.62: continue
              nearby.append(o); col=colors.get(o['kind'],(135,135,135))
              if abs(o['rot'])>1e-4 and o['kind'] in ('portal','speed'): d.polygon([(sx(x),sy(y)) for x,y in corners(o)],outline=col,width=2)
              elif o['kind']=='hazard' and o['sub']==1: d.ellipse((sx(o['x']-o['hw']),sy(o['y']+o['hh']),sx(o['x']+o['hw']),sy(o['y']-o['hh'])),outline=col,width=2)
              else: d.rectangle((sx(o['x']-o['hw']),sy(o['y']+o['hh']),sx(o['x']+o['hw']),sy(o['y']-o['hh'])),outline=col,width=2)
              if abs(o['x']-cx)<100 and abs(o['y']-cy)<100: d.text((sx(o['x']),sy(o['y'])),f"u{o['uid']} id{o['id']}",fill=(210,210,220))
            trail=[r for r in rs if r['frame']<=end['frame']][-300:]
            pts=[(sx(r['x']),sy(r['y'])) for r in trail]
            if len(pts)>1:d.line(pts,fill=(65,225,155),width=3)
            base=5 if end['mode']==4 else 15; half=base*(0.6 if end['mini'] else 1.0)
            d.rectangle((sx(cx-half),sy(cy+half),sx(cx+half),sy(cy-half)),outline=(255,255,255),width=4)
            killer=os[end['death']] if 0<=end['death']<len(os) else None
            desc='world/uninstrumented' if killer is None else f"u{killer['uid']} id{killer['id']} {killer['kind']} sub{killer['sub']} rot{killer['rot']:.1f}"
            d.rectangle((0,0,W,38),fill=(20,23,32)); d.text((12,11),f"{name} | {end['frame']} | {cx/30:.2f}bl,{cy/30:.2f}bl | mode={end['mode']} mini={end['mini']} | {desc}",fill=(245,245,250))
            im.save(out/f'{key}.png')
            report += [f'[{name}] {desc}',f'end={end}','nearby='+', '.join(f"u{o['uid']}/id{o['id']}/{o['kind']}@{o['x']:.1f},{o['y']:.1f} rot{o['rot']:.1f}" for o in nearby if abs(o['x']-cx)<120 and abs(o['y']-cy)<120),'']
          (out/'report.txt').write_text('\n'.join(report)); print('\n'.join(report))
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add diagnostics/demons_v8_fast/screens
          git commit -m 'add fast v8 blocker screenshots' || true
          git pull --rebase origin agent/gdlearn2-physics-v6
          git push
