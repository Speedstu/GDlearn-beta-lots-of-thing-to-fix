name: deadlocked current Pathfinder diff v8
on:
  push:
    branches: [agent/gdlearn2-physics-v6]
    paths: [.github/workflows/deadlocked_current_diff_v8.yml]
permissions: {contents: write}
jobs:
  diff:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build -j2
      - run: ./build/gdlearn selftest
      - shell: bash
        run: |
          set -euo pipefail
          python3 tools/pathfinder_diff.py \
            --bin ./build/gdlearn --gmd levels/20.gmd --name Deadlocked \
            --frames 5000 --work /tmp/pf-dead-current \
            --macro diagnostics/demons_v7/deadlocked.macro | tee /tmp/diff.log
          mkdir -p diagnostics
          { echo "tested_head=$GITHUB_SHA"; cat /tmp/diff.log; } > diagnostics/deadlocked_current_diff_v8.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add diagnostics/deadlocked_current_diff_v8.txt
          git commit -m 'record current Deadlocked Pathfinder diff v8' || true
          git push
