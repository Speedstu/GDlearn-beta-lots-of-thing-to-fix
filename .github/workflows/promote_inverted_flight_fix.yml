name: promote inverted flight fix

on:
  push:
    branches: [agent/gdlearn2-final]
    paths: [.github/workflows/promote_inverted_flight_fix.yml]

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply validated source fixes
        shell: python
        run: |
          from pathlib import Path

          # 1) Search: vertical preference is meaningful for ground modes, but
          # it actively destroys diversity in flight modes (especially inverted
          # ship) by preferring one side of the corridor. Rank flight by x only.
          p = Path('src/search/beam.cpp')
          s = p.read_text()
          old = '''        float score = ns.x + 0.02f * (ns.y * ns.gdir()) +\n                      (ns.onGround ? 0.5f : 0.0f);\n'''
          new = '''        const bool flight = ns.mode == Mode::Ship || ns.mode == Mode::Ufo ||\n                            ns.mode == Mode::Wave || ns.mode == Mode::Swing;\n        float score = flight ? ns.x\n                             : ns.x + 0.02f * (ns.y * ns.gdir()) +\n                                   (ns.onGround ? 0.5f : 0.0f);\n'''
          if old not in s:
              raise SystemExit('beam score anchor missing')
          p.write_text(s.replace(old, new, 1))

          # 2) Physics: the regular dynamic flight corridor above is already
          # gravity-independent. The second flipped-only branch fabricated a
          # remote reference (bottom_of_block - 300), which could become
          # negative and teleport an inverted ship below the level.
          p = Path('src/core/sim.cpp')
          s = p.read_text()
          begin = '''    // Symmetric clamp for flipped gravity.\n'''
          end = '''    }\n  }\n\n  int n = 0;\n'''
          i = s.find(begin)
          if i < 0:
              raise SystemExit('flipped clamp start missing')
          j = s.find(end, i)
          if j < 0:
              raise SystemExit('flipped clamp end missing')
          s = s[:i] + '''    // No second flipped-gravity clamp is needed here: the dynamic\n    // flight corridor above is defined in world space and already applies to\n    // both gravity directions. A second remote clamp used to teleport inverted\n    // ships below floorY when a nearby solid was less than one corridor-height\n    // above them.\n''' + s[j + 6:]
          p.write_text(s)

          # 3) Permanent regression: reproduce the old failure with an inverted
          # ship below a nearby solid whose bottom face is < FLIGHT_CEILING away.
          p = Path('src/app/main.cpp')
          s = p.read_text()
          anchor = '''  // 3. Determinism: same inputs => bit-identical state.\n'''
          test = '''  // Regression: an inverted flight mode must never be teleported below\n  // the level by a remote "ceiling" reference. The old flipped-only clamp\n  // turned (solid.bottom - FLIGHT_CEILING) into a target centre y, which is\n  // negative in this exact setup.\n  {\n    Level lv;\n    lv.name = "flipped-ship-regression";\n    lv.floorY = 0.0f;\n    lv.length = 1000.0f;\n    Object ceilingPiece;\n    ceilingPiece.kind = Kind::Solid;\n    ceilingPiece.x = 1.5f;\n    ceilingPiece.y = 200.0f;\n    ceilingPiece.hw = 15.0f;\n    ceilingPiece.hh = 15.0f;\n    lv.add(ceilingPiece);\n    lv.finalize();\n\n    Sim sim(&lv);\n    State st = sim.state();\n    st.mode = Mode::Ship;\n    st.flip = true;\n    st.onGround = false;\n    st.y = 100.0f;\n    st.vy = 0.0f;\n    sim.restore(st);\n    sim.step(false);\n    check(!sim.state().dead && sim.state().y >= lv.floorY + sim.state().halfH() &&\n              sim.state().y > 80.0f,\n          "inverted ship never teleports below floor from remote ceiling");\n  }\n\n  // 3. Determinism: same inputs => bit-identical state.\n'''
          if anchor not in s:
              raise SystemExit('selftest insertion anchor missing')
          p.write_text(s.replace(anchor, test, 1))

      - name: Build and selftest
        shell: bash
        run: |
          set -euo pipefail
          cmake -S . -B /tmp/build -DCMAKE_BUILD_TYPE=Release >/dev/null
          cmake --build /tmp/build -j"$(nproc)" >/dev/null
          /tmp/build/gdlearn selftest

      - name: Gate official demons and physical invariant
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/l /tmp/log
          python3 tools/gmd_to_gdl.py levels/14.gmd -o /tmp/l/c.gdl --name Clubstep
          python3 tools/gmd_to_gdl.py levels/18.gmd -o /tmp/l/t.gdl --name 'Theory of Everything 2'
          python3 tools/gmd_to_gdl.py levels/20.gmd -o /tmp/l/d.gdl --name Deadlocked
          set +e
          /tmp/build/gdlearn solve /tmp/l/c.gdl --beam 8192 --widen 0 --max-frames 43200 --stall 16000 --out /tmp/c.macro | tee /tmp/log/c.log
          /tmp/build/gdlearn solve /tmp/l/t.gdl --beam 32768 --widen 0 --max-frames 43200 --stall 26000 --out /tmp/t.macro | tee /tmp/log/t.log
          /tmp/build/gdlearn solve /tmp/l/d.gdl --beam 32768 --widen 0 --max-frames 43200 --stall 20000 --out /tmp/d.macro | tee /tmp/log/d.log
          set -e
          /tmp/build/gdlearn trace /tmp/l/t.gdl --macro /tmp/t.macro --frames 20000 --from 0 > /tmp/t.trace
          python3 - <<'PY'
          import re
          from pathlib import Path
          def pct(k):
              t=Path('/tmp/log/'+k+'.log').read_text()
              m=re.findall(r'(?:SOLVED|partial)\s+progress\s+([0-9.]+)%',t)
              return float(m[-1]) if m else -1.0
          ys=[]
          for line in Path('/tmp/t.trace').read_text().splitlines():
              m=re.match(r'\s*\d+\s+(?:HOLD|\.\.\.\.)\s+[\d.-]+\s+([\d.-]+)',line)
              if m: ys.append(float(m.group(1))*30.0)
          if not ys: raise SystemExit('trace parse failed')
          r={'clubstep':pct('c'),'toe2':pct('t'),'deadlocked':pct('d'),'toe2_min_y':min(ys)}
          print('RESULT',r)
          assert r['clubstep'] >= 9.30, r
          assert r['toe2'] >= 70.37, r
          assert r['deadlocked'] >= 6.74, r
          assert r['toe2_min_y'] >= 0.0, r
          PY

      - name: Commit validated fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/core/sim.cpp src/search/beam.cpp src/app/main.cpp
          git rm .github/workflows/promote_inverted_flight_fix.yml
          git commit -m 'fix inverted flight ceiling and beam ranking'
          git push
