name: gdlearn2 demon champion

on:
  push:
    branches:
      - agent/gdlearn2-final
    paths:
      - .github/workflows/train_champion.yml
  workflow_dispatch:
    inputs:
      pack:
        description: "Extra online Geometry Dash pack (official demons are always included)"
        required: true
        default: demons
        type: choice
        options: [demons, classics]
      cycles:
        description: "Search -> DAgger -> PPO champion cycles"
        required: true
        default: "2"
        type: string
      beams:
        description: "Exact-search beam ladder"
        required: true
        default: "1536,6144,24576"
        type: string
      ppo_steps:
        description: "PPO finisher steps per cycle (0 disables)"
        required: true
        default: "2000000"
        type: string

permissions:
  contents: read

env:
  BUILD_TYPE: Release

jobs:
  champion:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Build physically-valid 240 TPS engine
        shell: bash
        run: |
          set -euo pipefail
          cmake -S . -B build -DCMAKE_BUILD_TYPE="$BUILD_TYPE"
          cmake --build build -j"$(nproc)"
          ./build/gdlearn selftest

      - name: Convert bundled official demons
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/gd_real /tmp/gd_proc
          mkdir -p /tmp/gd_real /tmp/gd_proc
          python3 tools/gmd_to_gdl.py levels/14.gmd -o /tmp/gd_real/official_clubstep.gdl --name Clubstep
          python3 tools/gmd_to_gdl.py levels/18.gmd -o /tmp/gd_real/official_toe2.gdl --name "Theory of Everything 2"
          python3 tools/gmd_to_gdl.py levels/20.gmd -o /tmp/gd_real/official_deadlocked.gdl --name Deadlocked
          for f in /tmp/gd_real/*.gdl; do
            n="$(grep -c '^o ' "$f")"
            echo "$(basename "$f"): $n gameplay objects"
            test "$n" -gt 20
          done
          test "$(find /tmp/gd_real -maxdepth 1 -name '*.gdl' | wc -l)" -eq 3

      - name: Add online pack when server allows it
        if: github.event_name == 'workflow_dispatch'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/gd_online
          python3 tools/fetch_gd_level.py --pack "${{ inputs.pack }}" --out /tmp/gd_online
          for f in /tmp/gd_online/*.gdl; do
            [[ -e "$f" ]] || continue
            cp "$f" "/tmp/gd_real/online_$(basename "$f")"
          done

      - name: Seed verified curriculum floor
        shell: bash
        run: |
          set -euo pipefail
          for f in levels/d0_s0.gdl levels/d1_s0.gdl levels/d2_s0.gdl; do
            stem="$(basename "$f" .gdl)"
            cp "$f" "/tmp/gd_proc/proc_${stem}.gdl"
          done
          test "$(find /tmp/gd_proc -name '*.gdl' | wc -l)" -eq 3

      - name: Search and train monotonic champion
        shell: bash
        run: |
          set -euo pipefail
          rm -rf runs/champion runs/champion_work macros_native
          mkdir -p runs/champion_work macros_native

          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            CYCLES="${{ inputs.cycles }}"
            BEAMS="${{ inputs.beams }}"
            PPO_STEPS="${{ inputs.ppo_steps }}"
            EPOCHS=80
            ROUNDS=5
            TIERS=6
            HIDDEN=384
            RESCUE=24576
          else
            # First physically-valid bootstrap. Exact search is deliberately
            # strong; PPO stays off until exact oracles and DAgger are measured.
            CYCLES=1
            BEAMS="1536,6144,24576"
            PPO_STEPS=0
            EPOCHS=30
            ROUNDS=3
            TIERS=5
            HIDDEN=256
            RESCUE=6144
          fi

          python3 tools/champion.py \
            --bin ./build/gdlearn \
            --levels /tmp/gd_proc \
            --levels /tmp/gd_real \
            --work runs/champion_work \
            --champion runs/champion \
            --macros macros_native \
            --cycles "$CYCLES" \
            --beams "$BEAMS" \
            --prior-weight 8 \
            --max-ticks 43200 \
            --stall-ticks 12000 \
            --tiers "$TIERS" \
            --rounds "$ROUNDS" \
            --epochs "$EPOCHS" \
            --hidden "$HIDDEN" \
            --rescue-beam "$RESCUE" \
            --mem-budget-mb 4500 \
            --ppo-steps "$PPO_STEPS" \
            2>&1 | tee runs/champion_work/champion.log

          test -s runs/champion/policy.bin
          test -s runs/champion/obs_norm.bin
          test -s runs/champion/schema.txt
          test -s runs/champion/metrics.json

      - name: Final strict report
        if: always()
        shell: bash
        run: |
          echo '--- champion metrics ---'
          if [[ -f runs/champion/metrics.json ]]; then cat runs/champion/metrics.json; fi
          echo '--- exact native macros ---'
          find macros_native -maxdepth 1 -name '*.macro' -print 2>/dev/null || true
          echo '--- tail log ---'
          tail -n 240 runs/champion_work/champion.log 2>/dev/null || true

      - name: Upload champion checkpoint and evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gdlearn2-champion-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            runs/champion/policy.bin
            runs/champion/obs_norm.bin
            runs/champion/schema.txt
            runs/champion/metrics.json
            macros_native/*.macro
            runs/champion_work/champion.log
            runs/champion_work/**/metrics.json
