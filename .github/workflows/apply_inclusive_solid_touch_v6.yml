name: apply inclusive solid touch v6
on:
  push:
    branches: [agent/gdlearn2-physics-v6]
    paths: [.github/workflows/apply_inclusive_solid_touch_v6.yml]
permissions: {contents: write}
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - shell: bash
        run: |
          set -euo pipefail
          python3 tools/apply_inclusive_solid_touch_v6.py
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release >/dev/null
          cmake --build build -j2 >/dev/null
          ./build/gdlearn selftest
          python3 tools/pathfinder_diff.py --bin ./build/gdlearn --beam 6144 --frames 3000 | tee /tmp/diff.log
      - shell: bash
        run: |
          set -euo pipefail
          mkdir -p diagnostics
          cp /tmp/diff.log diagnostics/inclusive_solid_touch_v6.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/core/sim.cpp diagnostics/inclusive_solid_touch_v6.txt
          git rm tools/apply_inclusive_solid_touch_v6.py .github/workflows/apply_inclusive_solid_touch_v6.yml
          git commit -m 'match Pathfinder inclusive block touching semantics'
          git push
