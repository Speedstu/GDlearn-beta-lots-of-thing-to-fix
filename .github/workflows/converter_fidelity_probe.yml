name: one-shot conservative converter fidelity probe

on:
  push:
    branches:
      - agent/gdlearn2-replace
    paths:
      - .github/workflows/converter_fidelity_probe.yml

permissions:
  contents: write

jobs:
  probe:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Replace broad decoration-as-solid list with verified gameplay families
        shell: python
        run: |
          from pathlib import Path
          p = Path('tools/gmd_to_gdl.py')
          s = p.read_text()
          h0 = s.index('HAZARD_IDS = {')
          e0 = s.index('\n\n# Broad solid families', h0)
          h1 = s.index('SOLID_IDS =', e0)
          e1 = s.index('\n\n# gdl PortalKind', h1)
          replacement = r'''HAZARD_IDS = {
              8, 9, 39, 61, 103, 135, 143, 205,
              363, 364, 365, 392, 393, 394, 446, 447,
              667, 720, 721, 722, 768, 769, 989, 991,
          }

          # Only IDs known to participate in collision are solids. Geometry Dash
          # has thousands of decoration objects; treating visual tiles as blocks
          # creates fake walls and makes real levels unsolvable in the simulator.
          # This list is deliberately conservative and mirrors the project's
          # older parser for classic/official levels. Unknown IDs stay decoration
          # until live hitbox calibration proves otherwise.
          SOLID_IDS = set(range(1, 8)) | {
              40, 62, 63, 467, 468, 469,
              193, 194, 195, 196, 198, 199,
              204, 205, 206, 207, 208, 209,
              *range(247, 260),
              71, 72, 73, 74, 75, 76, 77, 78,
              *range(118, 130),
              *range(185, 193),
              *range(661, 696),
          }'''
          # 205 is a spike and is checked before SOLID_IDS in classify(), so its
          # overlap is harmless but retained to match the historical family.
          s = s[:h0] + replacement + s[e1:]
          p.write_text(s)

      - name: Build and compare official-demon search
        shell: bash
        run: |
          set -euo pipefail
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j"$(nproc)"
          mkdir -p /tmp/new
          python3 tools/gmd_to_gdl.py levels/14.gmd -o /tmp/new/clubstep.gdl --name Clubstep
          python3 tools/gmd_to_gdl.py levels/18.gmd -o /tmp/new/toe2.gdl --name 'Theory of Everything 2'
          python3 tools/gmd_to_gdl.py levels/20.gmd -o /tmp/new/deadlocked.gdl --name Deadlocked
          for f in /tmp/new/*.gdl; do echo "$(basename "$f") objects=$(grep -c '^o ' "$f")"; done

          set +e
          ./build/gdlearn solve /tmp/new/clubstep.gdl --beam 96 --widen 0 --max-frames 43200 --stall 1440 --out /tmp/c.macro | tee /tmp/c.log
          ./build/gdlearn solve /tmp/new/toe2.gdl --beam 96 --widen 0 --max-frames 43200 --stall 1440 --out /tmp/t.macro | tee /tmp/t.log
          ./build/gdlearn solve /tmp/new/deadlocked.gdl --beam 96 --widen 0 --max-frames 43200 --stall 1440 --out /tmp/d.macro | tee /tmp/d.log
          set -e

          python3 - <<'PY'
          import re
          baselines = {'c': 6.00, 't': 1.61, 'd': 3.89}
          vals = {}
          for k in baselines:
              txt = open('/tmp/'+k+'.log').read()
              m = re.findall(r'(?:SOLVED|partial)\s+progress\s+([0-9.]+)%', txt)
              if not m: raise SystemExit('no progress parsed for '+k)
              vals[k] = float(m[-1])
          print('baseline', baselines, 'conservative', vals)
          # Commit only if aggregate real-level reach improves materially and
          # no level catastrophically regresses.
          if sum(vals.values()) <= sum(baselines.values()) + 1.0:
              raise SystemExit('conservative classifier did not improve aggregate progress enough')
          if any(vals[k] + 0.5 < baselines[k] for k in vals):
              raise SystemExit('a demon regressed materially')
          PY

      - name: Commit validated converter and self-delete
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/converter_fidelity_probe.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'stop classifying GD decoration as solid collision'
          git push origin HEAD:agent/gdlearn2-replace
