name: Fresh demon benchmark v7
on:
  push:
    branches: [agent/gdlearn2-physics-v6]
    paths: [.github/workflows/fresh_demons_v7.yml]
permissions: {contents: write}
jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - shell: bash
        run: |
          set -euo pipefail
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release >/dev/null
          cmake --build build -j2 >/dev/null
          ./build/gdlearn selftest
          mkdir -p /tmp/demons diagnostics/demons_v7

          run_one() {
            NUM="$1"; NAME="$2"; KEY="$3"
            python3 tools/gmd_to_gdl.py "levels/${NUM}.gmd" -o "/tmp/demons/${KEY}.gdl" --name "$NAME"
            set +e
            ./build/gdlearn solve "/tmp/demons/${KEY}.gdl" \
              --beam 12288 --widen 0 --max-frames 30000 --stall 3000 \
              --out "diagnostics/demons_v7/${KEY}.macro" \
              > "/tmp/demons/${KEY}.solve.log" 2>&1
            RC=$?
            set -e
            ./build/gdlearn trace "/tmp/demons/${KEY}.gdl" \
              --macro "diagnostics/demons_v7/${KEY}.macro" --frames 30000 \
              > "/tmp/demons/${KEY}.trace" 2>&1 || true
            {
              echo "===== ${NAME} (${KEY}) ====="
              echo "solve_rc=${RC}"
              tail -n 12 "/tmp/demons/${KEY}.solve.log"
              echo "--- terminal trace ---"
              tail -n 8 "/tmp/demons/${KEY}.trace"
              echo
            } >> diagnostics/fresh_demons_v7.txt
          }

          : > diagnostics/fresh_demons_v7.txt
          echo "head=$GITHUB_SHA" >> diagnostics/fresh_demons_v7.txt
          echo "beam=12288 widen=0 max_frames=30000 stall=3000" >> diagnostics/fresh_demons_v7.txt
          echo >> diagnostics/fresh_demons_v7.txt
          run_one 14 "Clubstep" clubstep
          run_one 18 "Theory of Everything 2" toe2
          run_one 20 "Deadlocked" deadlocked

          cat diagnostics/fresh_demons_v7.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add diagnostics/fresh_demons_v7.txt diagnostics/demons_v7/*.macro
          git commit -m 'record fresh demon benchmark on corrected physics'
          git push
