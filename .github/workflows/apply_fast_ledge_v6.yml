name: apply fast ledge v6
on:
  push:
    branches: [agent/gdlearn2-physics-v6]
    paths: [.github/workflows/apply_fast_ledge_v6.yml]
permissions: {contents: write}
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - shell: bash
        run: |
          set -euo pipefail
          python3 tools/apply_fast_ledge_v6.py
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release >/dev/null
          cmake --build build -j2 >/dev/null
          ./build/gdlearn selftest
          python3 tools/pathfinder_diff.py --bin ./build/gdlearn --beam 6144 --frames 3000 | tee /tmp/diff.log
          python3 - <<'PY'
          import re
          t=open('/tmp/diff.log').read(); m=re.search(r'FIRST_DIVERGENCE \((\d+),',t)
          if not m: raise SystemExit('missing differential result')
          tick=int(m.group(1)); print('FAST_LEDGE_FIRST_DIVERGENCE',tick)
          if tick <= 912: raise SystemExit('fast ledge patch did not improve alignment')
          PY
      - shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/core/sim.cpp
          git rm tools/apply_fast_ledge_v6.py .github/workflows/apply_fast_ledge_v6.yml
          git commit -m 'match GD fast ledge fall post-collision correction'
          git push
