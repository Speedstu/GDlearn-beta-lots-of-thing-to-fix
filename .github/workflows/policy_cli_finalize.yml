name: one-shot policy cli finalizer

on:
  push:
    branches:
      - agent/gdlearn2-replace
    paths:
      - .github/workflows/policy_cli_finalize.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Wire policy inference into CLI
        run: python3 tools/_patch_policy_cli.py
      - name: Commit and self-delete
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/policy_cli_finalize.yml tools/_patch_policy_cli.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'wire policy guidance into solve and unify evaluation'
          git push origin HEAD:agent/gdlearn2-replace
