name: exact hazard fidelity A-B

on:
  push:
    branches:
      - agent/gdlearn2-replace
    paths:
      - .github/workflows/hazard_fidelity_matrix.yml

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Build engine
        shell: bash
        run: |
          set -euo pipefail
          cmake -S . -B /tmp/build -DCMAKE_BUILD_TYPE=Release
          cmake --build /tmp/build -j"$(nproc)"
          /tmp/build/gdlearn selftest

      - name: Create isolated exact-hazard patch helper
        shell: bash
        run: |
          cat > /tmp/hazard_patch.py <<'PY'
          import sys
          from pathlib import Path
          use_scale = sys.argv[1] == 'scale'
          p=Path('tools/gmd_to_gdl.py')
          s=p.read_text()
          anchor="""ORBS = {36: 0, 141: 1, 1333: 2, 84: 3, 1022: 4, 1330: 5,
                  1594: 6, 1704: 6, 1751: 6}
          """
          table="""
          # Exact dimensions ONLY for IDs already accepted by HAZARD_IDS.
          # This changes geometry, not the collision-object set.
          CLASSIC_HAZARD_SIZE = {
              8:(6.0,12.0), 9:(9.0,10.8), 39:(6.0,5.6),
              61:(9.0,7.2), 103:(4.0,7.6), 135:(14.1,20.0),
              205:(6.0,5.6), 365:(9.0,6.0), 392:(2.6,4.8),
              446:(9.0,7.2), 447:(5.2,7.2), 667:(9.0,6.0),
              720:(2.40039063,3.20001221), 768:(4.5,5.2),
              989:(9.0,12.0), 991:(2.40039063,3.20001221),
          }
          """
          if anchor not in s:
              raise SystemExit('mapping anchor not found')
          s=s.replace(anchor,anchor+table,1)
          old="""    if oid in HAZARD_IDS:
                  hw, hh = _rotated_half_extents(4.0 * sx, 8.0 * sy, rot)
                  return GdlObject('hazard', 0, x, y, hw, hh, oid)
          """
          new="""    if oid in HAZARD_IDS:
                  if oid in CLASSIC_HAZARD_SIZE:
                      w, h = CLASSIC_HAZARD_SIZE[oid]
                      hw, hh = _rotated_half_extents(0.5 * w * sx, 0.5 * h * sy, rot)
                  else:
                      hw, hh = _rotated_half_extents(4.0 * sx, 8.0 * sy, rot)
                  return GdlObject('hazard', 0, x, y, hw, hh, oid)
          """
          if old not in s:
              raise SystemExit('hazard classify block not found')
          s=s.replace(old,new,1)
          if use_scale:
              old="""    scale = max(0.01, abs(_f(props, 32, 1.0)))
              sx = max(0.01, abs(_f(props, 128, scale)))
              sy = max(0.01, abs(_f(props, 129, scale)))
          """
              new="""    scale = max(0.01, abs(_f(props, 32, 1.0)))
              sx = scale * max(0.01, abs(_f(props, 128, 1.0)))
              sy = scale * max(0.01, abs(_f(props, 129, 1.0)))
          """
              if old not in s:
                  raise SystemExit('scale block not found')
              s=s.replace(old,new,1)
          p.write_text(s)
          PY

      - name: Probe exact dimensions only
        shell: bash
        run: |
          set -euo pipefail
          cp tools/gmd_to_gdl.py /tmp/original.py
          python3 /tmp/hazard_patch.py noscale
          mkdir -p /tmp/l1 /tmp/log1
          python3 tools/gmd_to_gdl.py levels/14.gmd -o /tmp/l1/c.gdl --name Clubstep
          python3 tools/gmd_to_gdl.py levels/18.gmd -o /tmp/l1/t.gdl --name 'Theory of Everything 2'
          python3 tools/gmd_to_gdl.py levels/20.gmd -o /tmp/l1/d.gdl --name Deadlocked
          for f in /tmp/l1/*.gdl; do echo "sizes $(basename "$f") objects=$(grep -c '^o ' "$f")"; done
          set +e
          for k in c t d; do
            /tmp/build/gdlearn solve /tmp/l1/$k.gdl --beam 96 --widen 0 --max-frames 43200 --stall 1440 --out /tmp/one-$k.macro | tee /tmp/log1/$k.log
          done
          set -e

      - name: Probe exact dimensions plus composed scale
        shell: bash
        run: |
          set -euo pipefail
          cp /tmp/original.py tools/gmd_to_gdl.py
          python3 /tmp/hazard_patch.py scale
          mkdir -p /tmp/l2 /tmp/log2
          python3 tools/gmd_to_gdl.py levels/14.gmd -o /tmp/l2/c.gdl --name Clubstep
          python3 tools/gmd_to_gdl.py levels/18.gmd -o /tmp/l2/t.gdl --name 'Theory of Everything 2'
          python3 tools/gmd_to_gdl.py levels/20.gmd -o /tmp/l2/d.gdl --name Deadlocked
          for f in /tmp/l2/*.gdl; do echo "scale $(basename "$f") objects=$(grep -c '^o ' "$f")"; done
          set +e
          for k in c t d; do
            /tmp/build/gdlearn solve /tmp/l2/$k.gdl --beam 96 --widen 0 --max-frames 43200 --stall 1440 --out /tmp/two-$k.macro | tee /tmp/log2/$k.log
          done
          set -e

      - name: Print comparison
        shell: python
        run: |
          import re
          baseline={'c':6.00,'t':1.61,'d':6.41}
          def values(root):
              out={}
              for k in baseline:
                  text=open(root+'/'+k+'.log').read()
                  m=re.findall(r'(?:SOLVED|partial)\s+progress\s+([0-9.]+)%',text)
                  if not m:
                      raise SystemExit('missing '+root+'/'+k)
                  out[k]=float(m[-1])
              return out
          a=values('/tmp/log1')
          b=values('/tmp/log2')
          print('BASELINE',baseline,'sum',sum(baseline.values()))
          print('EXACT_EXISTING_HAZARDS',a,'sum',sum(a.values()))
          print('EXACT_EXISTING_HAZARDS_SCALE',b,'sum',sum(b.values()))
