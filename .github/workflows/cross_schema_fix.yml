name: one-shot cross-schema resume fix

on:
  push:
    branches:
      - agent/gdlearn2-replace
    paths:
      - .github/workflows/cross_schema_fix.yml

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Accept both native checkpoint producers
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          patches = {
              Path('src/rl/ppo.cpp'): (
                  '  if (magic != "gdlearn_policy_v2") return false;\n',
                  '  if (magic != "gdlearn_policy_v2" && magic != "gdlearn_imitation_v2") return false;\n'
              ),
              Path('src/rl/curriculum.cpp'): (
                  '    if (magic != "gdlearn_imitation_v2") return false;\n',
                  '    if (magic != "gdlearn_imitation_v2" && magic != "gdlearn_policy_v2") return false;\n'
              ),
          }
          for p, (old, new) in patches.items():
              s = p.read_text()
              if old not in s:
                  raise SystemExit(f'expected schema check not found in {p}')
              p.write_text(s.replace(old, new, 1))
          PY
      - name: Build
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j"$(nproc)"
      - name: Prove PPO can resume an imitation-schema native checkpoint
        shell: bash
        run: |
          set -euo pipefail
          ./build/gdlearn train --levels levels/d0_s0.gdl --envs 2 --steps-per-env 4 \
            --epochs 1 --minibatch 4 --total-steps 8 --save-every 0 --out /tmp/base
          sed -i '1s/gdlearn_policy_v2/gdlearn_imitation_v2/' /tmp/base/schema.txt
          ./build/gdlearn train --levels levels/d0_s0.gdl --envs 2 --steps-per-env 4 \
            --epochs 1 --minibatch 4 --total-steps 8 --save-every 0 --out /tmp/base --resume \
            | tee /tmp/resume.log
          grep 'resumed from /tmp/base' /tmp/resume.log
      - name: Commit and self-delete
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/cross_schema_fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'allow PPO and DAgger checkpoints to cross-resume'
          git push origin HEAD:agent/gdlearn2-replace
