name: Install trace mini tier v7
on:
  push:
    branches: [agent/gdlearn2-physics-v6]
    paths: [.github/workflows/apply_trace_mini_tier_v7.yml]
permissions: {contents: write}
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - shell: bash
        run: |
          set -euo pipefail
          python3 tools/apply_trace_mini_tier_v7.py
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release >/dev/null
          cmake --build build -j2 >/dev/null
          ./build/gdlearn selftest >/dev/null
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/app/main.cpp
          git rm tools/apply_trace_mini_tier_v7.py .github/workflows/apply_trace_mini_tier_v7.yml
          git commit -m 'include mini and speed tier in trace diagnostics'
          git push