name: Import gdlearn2

on:
  push:
    branches:
      - agent/gdlearn2-import-20260813

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Replace repository contents
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import base64, hashlib
          parts = [Path(f'.payload/part{i:02d}').read_bytes() for i in range(8)]
          joined = b''.join(parts)
          allowed = b'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/='
          clean = bytes(c for c in joined if c in allowed)
          print(f'payload bytes={len(joined)} clean_base64={len(clean)} removed={len(joined)-len(clean)}')
          raw = base64.b64decode(clean, validate=True)
          got = hashlib.sha256(raw).hexdigest()
          expected = '8562b65d7da527822b78598f1ce8fe1a142583bebe514d3238d0ab3be68932ff'
          print('archive sha256=' + got)
          if got != expected:
              raise SystemExit(f'SHA256 mismatch: expected {expected}, got {got}')
          Path('/tmp/gdlearn2.tar.xz').write_bytes(raw)
          PY
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          tar -xJf /tmp/gdlearn2.tar.xz -C .
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          TREE="$(git write-tree)"
          OLD_MASTER="484a0ad6ad6c5593de8b46cb2cdf221ed1fb46d6"
          COMMIT="$(printf '%s\n' 'Replace old Geometry Dash ML bot with gdlearn2' | git commit-tree "$TREE" -p "$OLD_MASTER")"
          git push origin "$COMMIT:refs/heads/master"
          git push origin --delete agent/gdlearn2-import-20260813 || true
