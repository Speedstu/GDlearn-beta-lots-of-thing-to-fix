name: Import gdlearn2

on:
  push:
    branches:
      - agent/gdlearn2-import-20260813

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Replace repository contents
        shell: bash
        run: |
          set -euo pipefail
          OLD_MASTER="$(git rev-parse HEAD^)"
          cat .payload/part00 .payload/part01 .payload/part02 .payload/part03 .payload/part04 .payload/part05 .payload/part06 .payload/part07 > /tmp/gdlearn2.b64
          base64 -d /tmp/gdlearn2.b64 > /tmp/gdlearn2.tar.xz
          echo "8562b65d7da527822b78598f1ce8fe1a142583bebe514d3238d0ab3be68932ff  /tmp/gdlearn2.tar.xz" | sha256sum -c -
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          tar -xJf /tmp/gdlearn2.tar.xz -C .
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          TREE="$(git write-tree)"
          COMMIT="$(printf '%s\n' 'Replace old Geometry Dash ML bot with gdlearn2' | git commit-tree "$TREE" -p "$OLD_MASTER")"
          git push origin "$COMMIT:refs/heads/master"
          git push origin --delete agent/gdlearn2-import-20260813 || true
