name: promote collision diagnostics

on:
  push:
    branches: [agent/gdlearn2-final]
    paths: [.github/workflows/promote_collision_diagnostics.yml]

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch simulator diagnostics
        shell: python
        run: |
          from pathlib import Path

          # sim.hpp: diagnostics live on Sim, not State, so beam snapshots/hash
          # stay byte-identical and training performance is unaffected.
          p=Path('src/core/sim.hpp'); s=p.read_text()
          a='''  float ceiling() const { return lastCeiling_; }\n  State& mutableState() { return st_; }\n'''
          b='''  float ceiling() const { return lastCeiling_; }\n  int lastContactUid() const { return lastContactUid_; }\n  int deathUid() const { return deathUid_; }\n  State& mutableState() { return st_; }\n'''
          if a not in s: raise SystemExit('sim.hpp accessor anchor missing')
          s=s.replace(a,b,1)
          a='''  State st_{};\n  float lastCeiling_ = 0;\n'''
          b='''  State st_{};\n  float lastCeiling_ = 0;\n  int lastContactUid_ = -1;\n  int deathUid_ = -1;\n'''
          if a not in s: raise SystemExit('sim.hpp field anchor missing')
          p.write_text(s.replace(a,b,1))

          p=Path('src/core/sim.cpp'); s=p.read_text()
          a='''bool Sim::step(bool hold) {\n  if (!alive()) return false;\n\n  const bool press = hold && !st_.holding;\n'''
          b='''bool Sim::step(bool hold) {\n  if (!alive()) return false;\n  lastContactUid_ = -1;\n  deathUid_ = -1;\n\n  const bool press = hold && !st_.holding;\n'''
          if a not in s: raise SystemExit('step anchor missing')
          s=s.replace(a,b,1)

          # Hazard death.
          a='''    if (aabb(st_.x, st_.y, lhw, lhh, o.x, o.y, o.hw, o.hh)) {\n      st_.dead = true;\n      return;\n    }\n'''
          b='''    if (aabb(st_.x, st_.y, lhw, lhh, o.x, o.y, o.hw, o.hh)) {\n      lastContactUid_ = o.uid;\n      deathUid_ = o.uid;\n      st_.dead = true;\n      return;\n    }\n'''
          if a not in s: raise SystemExit('hazard death anchor missing')
          s=s.replace(a,b,1)

          # Solid wave death: first matching block only.
          a='''    if (diesOnTouch(st_.mode)) {\n      st_.dead = true;\n      return;\n    }\n    const float surfaceTop'''
          b='''    if (diesOnTouch(st_.mode)) {\n      lastContactUid_ = o.uid;\n      deathUid_ = o.uid;\n      st_.dead = true;\n      return;\n    }\n    const float surfaceTop'''
          if a not in s: raise SystemExit('solid wave death anchor missing')
          s=s.replace(a,b,1)

          # Legal landing.
          a='''      st_.jumpHold = 0;\n      landed = true;\n    } else if (!falling'''
          b='''      st_.jumpHold = 0;\n      lastContactUid_ = o.uid;\n      landed = true;\n    } else if (!falling'''
          if a not in s: raise SystemExit('landing anchor missing')
          s=s.replace(a,b,1)

          # Head death.
          a='''      if (!isFlightMode(st_.mode)) {\n        st_.dead = true;\n        return;\n      }\n'''
          b='''      if (!isFlightMode(st_.mode)) {\n        lastContactUid_ = o.uid;\n        deathUid_ = o.uid;\n        st_.dead = true;\n        return;\n      }\n'''
          if a not in s: raise SystemExit('head death anchor missing')
          s=s.replace(a,b,1)

          # Wall death (exact comment makes anchor unique).
          a='''    } else if (aabb(st_.x, st_.y, bhw, bhh, o.x, o.y, o.hw, o.hh)) {\n      // Ran into the wall for real: that is a death in GD, not a slide.\n      st_.dead = true;\n      return;\n'''
          b='''    } else if (aabb(st_.x, st_.y, bhw, bhh, o.x, o.y, o.hw, o.hh)) {\n      // Ran into the wall for real: that is a death in GD, not a slide.\n      lastContactUid_ = o.uid;\n      deathUid_ = o.uid;\n      st_.dead = true;\n      return;\n'''
          if a not in s: raise SystemExit('wall death anchor missing')
          s=s.replace(a,b,1)

          # Corner snap contact.
          a='''        st_.jumpHold = 0;\n        landed = true;\n      }\n'''
          b='''        st_.jumpHold = 0;\n        lastContactUid_ = o.uid;\n        landed = true;\n      }\n'''
          if a not in s: raise SystemExit('corner contact anchor missing')
          s=s.replace(a,b,1)

          # Pads/orbs and portals report the triggering object.
          a='''void Sim::applyPad(const Object& o) {\n  st_.lastPadUid = o.uid;\n'''
          b='''void Sim::applyPad(const Object& o) {\n  lastContactUid_ = o.uid;\n  st_.lastPadUid = o.uid;\n'''
          if a not in s: raise SystemExit('pad anchor missing')
          s=s.replace(a,b,1)
          a='''void Sim::applyOrb(const Object& o) {\n  st_.lastOrbUid = o.uid;\n'''
          b='''void Sim::applyOrb(const Object& o) {\n  lastContactUid_ = o.uid;\n  st_.lastOrbUid = o.uid;\n'''
          if a not in s: raise SystemExit('orb anchor missing')
          s=s.replace(a,b,1)
          a='''void Sim::applyPortal(const Object& o) {\n  if (o.kind == Kind::Speed) {\n'''
          b='''void Sim::applyPortal(const Object& o) {\n  lastContactUid_ = o.uid;\n  if (o.kind == Kind::Speed) {\n'''
          if a not in s: raise SystemExit('portal anchor missing')
          p.write_text(s.replace(a,b,1))

          # main.cpp: expose the diagnostics in the existing trace command.
          p=Path('src/app/main.cpp'); s=p.read_text()
          a='''  std::printf("frame  hold      x(bl)   y(bl)     vy  ground  dead  mode\\n");\n'''
          b='''  std::printf("frame  hold      x(bl)   y(bl)     vy  ground dead mode flip pad orb contact deathuid\\n");\n'''
          if a not in s: raise SystemExit('trace header anchor missing')
          s=s.replace(a,b,1)
          a='''      std::printf("%5d  %s   %8.3f %7.3f %6.2f     %d     %d     %d\\n", f,\n                  hold ? "HOLD" : "....", s.x / phys::BLOCK,\n                  s.y / phys::BLOCK, s.vy, s.onGround ? 1 : 0,\n                  s.dead ? 1 : 0, static_cast<int>(s.mode));\n'''
          b='''      std::printf("%5d  %s   %8.3f %7.3f %6.2f     %d    %d    %d    %d %d %d %d %d\\n", f,\n                  hold ? "HOLD" : "....", s.x / phys::BLOCK,\n                  s.y / phys::BLOCK, s.vy, s.onGround ? 1 : 0,\n                  s.dead ? 1 : 0, static_cast<int>(s.mode), s.flip ? 1 : 0,\n                  s.lastPadUid, s.lastOrbUid, sim.lastContactUid(), sim.deathUid());\n'''
          if a not in s: raise SystemExit('trace row anchor missing')
          p.write_text(s.replace(a,b,1))

      - name: Build and selftest
        shell: bash
        run: |
          set -euo pipefail
          cmake -S . -B /tmp/build -DCMAKE_BUILD_TYPE=Release
          cmake --build /tmp/build -j"$(nproc)"
          /tmp/build/gdlearn selftest

      - name: Commit diagnostics
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/core/sim.hpp src/core/sim.cpp src/app/main.cpp
          git rm .github/workflows/promote_collision_diagnostics.yml
          git commit -m 'add collision UID diagnostics to trace'
          git push
