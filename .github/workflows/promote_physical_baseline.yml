name: promote physically valid baseline

on:
  push:
    branches:
      - agent/gdlearn2-final
    paths:
      - .github/workflows/promote_physical_baseline.yml

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Move hazards after contact correction
        shell: python
        run: |
          from pathlib import Path
          p=Path('src/core/sim.cpp')
          s=p.read_text()
          early='''  // Pass 2: hazards (inner hitbox), then solids, then boosts.\n  for (int i = 0; i < n; ++i) {\n    const Object& o = objs[idx[i]];\n    if (o.kind != Kind::Hazard) continue;\n    if (aabb(st_.x, st_.y, lhw, lhh, o.x, o.y, o.hw, o.hh)) {\n      lastContactUid_ = o.uid;\n      deathUid_ = o.uid;\n      st_.dead = true;\n      return;\n    }\n  }\n\n'''
          if early not in s:
              raise SystemExit('current early hazard phase not found')
          s=s.replace(early,'',1)
          close='''\n}\n\nvoid Sim::applyPad'''
          if close not in s:
              raise SystemExit('resolveWorld close not found')
          late='''\n  // Hazards are checked after portals, solid contact correction and pads/orbs.\n  // This avoids killing the pre-correction pose when GD would first snap the\n  // player onto a valid surface or trigger an overlapping gameplay object.\n  for (int i = 0; i < n; ++i) {\n    const Object& o = objs[idx[i]];\n    if (o.kind != Kind::Hazard) continue;\n    if (aabb(st_.x, st_.y, lhw, lhh, o.x, o.y, o.hw, o.hh)) {\n      lastContactUid_ = o.uid;\n      deathUid_ = o.uid;\n      st_.dead = true;\n      return;\n    }\n  }\n'''
          s=s.replace(close,late+close,1)
          p.write_text(s)

      - name: Build and permanent regressions
        shell: bash
        run: |
          set -euo pipefail
          cmake -S . -B /tmp/build -DCMAKE_BUILD_TYPE=Release
          cmake --build /tmp/build -j"$(nproc)"
          /tmp/build/gdlearn selftest

      - name: Healthy official-demon baseline
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/l /tmp/log
          python3 tools/gmd_to_gdl.py levels/14.gmd -o /tmp/l/c.gdl --name Clubstep
          python3 tools/gmd_to_gdl.py levels/18.gmd -o /tmp/l/t.gdl --name 'Theory of Everything 2'
          python3 tools/gmd_to_gdl.py levels/20.gmd -o /tmp/l/d.gdl --name Deadlocked
          set +e
          for k in c t d; do
            /tmp/build/gdlearn solve /tmp/l/$k.gdl --beam 96 --widen 0 --max-frames 43200 --stall 3000 --out /tmp/$k.macro | tee /tmp/log/$k.log
          done
          /tmp/build/gdlearn solve /tmp/l/t.gdl --beam 1536 --widen 0 --max-frames 43200 --stall 8000 --out /tmp/t1536.macro | tee /tmp/log/t1536.log
          set -e
          python3 - <<'PY'
          import re
          from pathlib import Path
          def metric(path):
              text=Path(path).read_text()
              m=re.findall(r'(?:SOLVED|partial)\s+progress\s+([0-9.]+)%.*?verify\s+([0-9.]+)%',text)
              if not m: raise SystemExit('missing metric '+path)
              p,v=map(float,m[-1])
              if abs(p-v)>0.02: raise SystemExit(f'replay mismatch {path}: {p} vs {v}')
              return p
          r={'clubstep':metric('/tmp/log/c.log'),'toe2':metric('/tmp/log/t.log'),
             'deadlocked':metric('/tmp/log/d.log'),'toe2_b1536':metric('/tmp/log/t1536.log')}
          print('PHYSICALLY_VALID_BASELINE',r)
          if r['clubstep'] < 8.0: raise SystemExit('Clubstep healthy regression')
          if r['toe2'] < 1.5: raise SystemExit('ToE2 healthy regression')
          if r['deadlocked'] < 1.5: raise SystemExit('Deadlocked healthy regression')
          if r['toe2_b1536'] < 2.0: raise SystemExit('ToE2 wide-beam healthy regression')
          PY

      - name: Promote
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/core/sim.cpp
          git rm .github/workflows/promote_physical_baseline.yml
          git commit -m 'resolve hazards after physical contact correction'
          git push
