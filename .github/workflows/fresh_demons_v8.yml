name: fresh demons v8
on:
  push:
    branches: [agent/gdlearn2-physics-v6]
    paths: [.github/workflows/fresh_demons_v8.yml]
permissions: {contents: write}
jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build -j2
      - run: ./build/gdlearn selftest
      - name: solve three official demons
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/dv8 diagnostics/demons_v8
          : > diagnostics/fresh_demons_v8.txt
          echo "head=$GITHUB_SHA" >> diagnostics/fresh_demons_v8.txt
          echo "beam=32768 widen=0 max_frames=50000 stall=16000" >> diagnostics/fresh_demons_v8.txt
          echo >> diagnostics/fresh_demons_v8.txt
          run_one() {
            NUM="$1"; NAME="$2"; KEY="$3"
            python3 tools/gmd_to_gdl.py "levels/${NUM}.gmd" -o "/tmp/dv8/${KEY}.gdl" --name "$NAME"
            set +e
            /usr/bin/time -f 'wall_s=%e maxrss_kb=%M' \
              ./build/gdlearn solve "/tmp/dv8/${KEY}.gdl" \
              --beam 32768 --widen 0 --max-frames 50000 --stall 16000 \
              --out "diagnostics/demons_v8/${KEY}.macro" \
              > "/tmp/dv8/${KEY}.solve" 2>&1
            RC=$?
            set -e
            ./build/gdlearn trace "/tmp/dv8/${KEY}.gdl" \
              --macro "diagnostics/demons_v8/${KEY}.macro" --frames 50000 \
              > "/tmp/dv8/${KEY}.trace" 2>&1 || true
            {
              echo "===== $NAME ($KEY) ====="
              echo "solve_rc=$RC"
              tail -n 18 "/tmp/dv8/${KEY}.solve"
              echo '--- terminal ---'
              tail -n 7 "/tmp/dv8/${KEY}.trace"
              echo
            } >> diagnostics/fresh_demons_v8.txt
          }
          run_one 14 Clubstep clubstep
          run_one 18 'Theory of Everything 2' toe2
          run_one 20 Deadlocked deadlocked
          cat diagnostics/fresh_demons_v8.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+users.noreply.github.com'
          git add diagnostics/fresh_demons_v8.txt diagnostics/demons_v8/*.macro
          git commit -m 'record fresh v8 official demon solves' || true
          git push
