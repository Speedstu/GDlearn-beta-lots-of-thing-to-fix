name: v8 full Pathfinder divergence windows
on:
  push:
    branches: [agent/gdlearn2-physics-v6]
    paths: [.github/workflows/v8_diff_windows.yml]
permissions: {contents: write}
jobs:
  diff:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - shell: bash
        run: |
          set -euo pipefail
          for f in diagnostics/demons_v8_fast/clubstep.macro diagnostics/demons_v8_fast/toe2.macro diagnostics/demons_v8_fast/deadlocked.macro; do [ -f "$f" ] || { echo missing; exit 0; }; done
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release >/dev/null
          cmake --build build -j2 >/dev/null
          mkdir -p diagnostics/v8_diff_windows /tmp/v8dw
          run_one() {
            KEY="$1"; NUM="$2"; NAME="$3"
            python3 tools/pathfinder_diff.py --bin ./build/gdlearn --gmd "levels/${NUM}.gmd" --name "$NAME" --frames 12000 --work "/tmp/v8dw/$KEY" --macro "diagnostics/demons_v8_fast/${KEY}.macro" > "diagnostics/v8_diff_windows/${KEY}.txt"
          }
          run_one clubstep 14 Clubstep
          run_one toe2 18 'Theory of Everything 2'
          run_one deadlocked 20 Deadlocked
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add diagnostics/v8_diff_windows
          git commit -m 'record full v8 Pathfinder divergence windows' || true
          git pull --rebase origin agent/gdlearn2-physics-v6
          git push
