name: one-shot PPO rollout safety fix

on:
  push:
    branches:
      - agent/gdlearn2-replace
    paths:
      - .github/workflows/ppo_norm_fix.yml

permissions:
  contents: write

jobs:
  fix-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fix normalization sample bound
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/rl/ppo.cpp')
          s = p.read_text()
          old = '  norm_.observe(obsBuf_.data(), 256);\n'
          new = ('  const int normSamples = static_cast<int>(std::min<size_t>(256, roll));\n'
                 '  if (normSamples > 0) norm_.observe(obsBuf_.data(), normSamples);\n')
          if old not in s:
              raise SystemExit('expected unsafe norm_.observe call not found')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Build patched tree
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j"$(nproc)"
      - name: Validate tiny PPO plus universal policy runner
        shell: bash
        run: |
          set -euo pipefail
          ./build/gdlearn selftest
          ./build/gdlearn train --levels levels/d0_s0.gdl --envs 2 --steps-per-env 4 \
            --epochs 1 --minibatch 4 --total-steps 8 --save-every 0 --out /tmp/policy
          grep '^gdlearn_policy_v2$' /tmp/policy/schema.txt
          set +e
          ./build/gdlearn eval /tmp/policy levels/d0_s0.gdl --max-frames 80 --out /tmp/eval.macro
          EVAL_RC=$?
          ./build/gdlearn solve levels/d0_s0.gdl --policy /tmp/policy --prior-weight 4 \
            --beam 16 --max-frames 80 --stall 40 --widen 0 --out /tmp/guided.macro
          SOLVE_RC=$?
          set -e
          test "$EVAL_RC" -ne 1
          test "$EVAL_RC" -ne 2
          test "$SOLVE_RC" -ne 2
          test -s /tmp/eval.macro
          test -s /tmp/guided.macro
      - name: Commit fix and self-delete
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/ppo_norm_fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix PPO normalization bounds and validate policy pipeline'
          git push origin HEAD:agent/gdlearn2-replace
