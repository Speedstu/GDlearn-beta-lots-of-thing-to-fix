name: Pathfinder diff v2
on:
  push:
    branches: [agent/gdlearn2-physics-v6]
    paths: [.github/workflows/pathfinder_diff_v2.yml, tools/pathfinder_diff.py]
permissions: {contents: write}
jobs:
  diff:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - run: python3 tools/apply_full_hazard_hitbox_v6.py
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build -j2
      - run: ./build/gdlearn selftest
      - run: python3 tools/pathfinder_diff.py --bin ./build/gdlearn --beam 6144 --frames 3000 | tee /tmp/diff.log
      - shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re, pathlib
          t=open('/tmp/diff.log').read()
          m=re.search(r'FIRST_DIVERGENCE \((\d+),', t)
          tick=int(m.group(1)) if m else -1
          print('FULL_HAZARD_FIRST_DIVERGENCE', tick)
          pathlib.Path('/tmp/tick.txt').write_text(str(tick))
          PY
          mkdir -p diagnostics
          { echo "tested_head=$GITHUB_SHA"; echo -n "first_divergence="; cat /tmp/tick.txt; echo; cat /tmp/diff.log; } > diagnostics/pathfinder_diff_latest.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add diagnostics/pathfinder_diff_latest.txt
          git commit -m 'record latest Pathfinder differential' || true
          git push
