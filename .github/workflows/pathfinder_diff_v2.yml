name: Commit validated gravity portal velocity v6
on:
  push:
    branches: [agent/gdlearn2-physics-v6]
    paths: [.github/workflows/pathfinder_diff_v2.yml]
permissions: {contents: write}
jobs:
  commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - shell: bash
        run: |
          set -euo pipefail
          python3 tools/apply_gravity_portal_velocity_v6.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/core/sim.cpp
          git rm tools/apply_gravity_portal_velocity_v6.py
          git commit -m 'match Geometry Dash gravity portal velocity transform'
          git push
