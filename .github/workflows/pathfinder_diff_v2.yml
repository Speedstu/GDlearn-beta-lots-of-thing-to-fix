name: Validate gravity portal velocity v6
on:
  push:
    branches: [agent/gdlearn2-physics-v6]
    paths: [.github/workflows/pathfinder_diff_v2.yml]
permissions: {contents: write}
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: patch build selftest fixed-macro diff
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/apply_gravity_portal_velocity_v6.py
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release >/dev/null
          cmake --build build -j2 >/dev/null
          ./build/gdlearn selftest
          python3 tools/pathfinder_diff.py \
            --bin ./build/gdlearn \
            --frames 3000 \
            --work /tmp/pf-gravity-vel \
            --macro diagnostics/pathfinder_reference.macro \
            | tee /tmp/gravity_vel.log
          python3 - <<'PY'
          import pathlib,re
          t=pathlib.Path('/tmp/gravity_vel.log').read_text()
          m=re.search(r'FIRST_DIVERGENCE \((\d+),',t)
          if m:
              tick=int(m.group(1)); ok=tick>1794
          elif 'FIRST_DIVERGENCE None' in t:
              tick=999999; ok=True
          else:
              tick=-1; ok=False
          pathlib.Path('/tmp/gravity_tick.txt').write_text(str(tick))
          print('GRAVITY_VEL_FIRST_DIVERGENCE',tick)
          if not ok: raise SystemExit(f'gravity portal velocity did not improve alignment: {tick}')
          PY
      - name: persist validated patch
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p diagnostics
          cp /tmp/gravity_vel.log diagnostics/gravity_portal_velocity_v6.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/core/sim.cpp diagnostics/gravity_portal_velocity_v6.txt
          git rm tools/apply_gravity_portal_velocity_v6.py
          git commit -m 'match Geometry Dash gravity portal velocity transform'
          git push
