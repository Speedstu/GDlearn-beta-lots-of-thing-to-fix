name: Pathfinder CI heartbeat
on:
  push:
    branches: [agent/gdlearn2-physics-v6]
    paths: [.github/workflows/pathfinder_diff_v2.yml]
permissions: {contents: write}
jobs:
  heartbeat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: persist heartbeat before any build
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p diagnostics
          printf 'head=%s\nrun=%s\nrunner=started\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" > diagnostics/ci_heartbeat.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add diagnostics/ci_heartbeat.txt
          git commit -m 'record CI heartbeat' || true
          git push
