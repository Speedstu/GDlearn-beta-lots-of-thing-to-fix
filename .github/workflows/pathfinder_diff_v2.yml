name: Pathfinder terminal-state verification
on:
  push:
    branches: [agent/gdlearn2-physics-v6]
    paths: [.github/workflows/pathfinder_diff_v2.yml]
permissions: {contents: write}
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - shell: bash
        run: |
          set -euo pipefail
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release >/dev/null
          cmake --build build -j2 >/dev/null
          ./build/gdlearn selftest
          python3 tools/pathfinder_diff.py \
            --bin ./build/gdlearn \
            --frames 3000 \
            --work /tmp/pf-terminal \
            --macro diagnostics/pathfinder_reference.macro \
            | tee /tmp/terminal.log
          mkdir -p diagnostics
          cp /tmp/terminal.log diagnostics/pathfinder_terminal_state.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add diagnostics/pathfinder_terminal_state.txt
          git commit -m 'record Pathfinder terminal-state verification' || true
          git push
