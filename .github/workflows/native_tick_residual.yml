name: one-shot native tick residuals
on:
  push:
    branches: [agent/gdlearn2-replace]
    paths: [.github/workflows/native_tick_residual.yml]
permissions:
  contents: write
jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Fix remaining real-time literals
        shell: python
        run: |
          from pathlib import Path
          patches = {
            Path('src/app/main.cpp'): {
              '60 * 10': 'phys::ticks(10.0f)',
              '60 * 6': 'phys::ticks(6.0f)',
            },
            Path('src/rl/curriculum.cpp'): {
              '60 * 10': 'phys::ticks(10.0f)',
            },
            Path('src/env/env.hpp'): {
              '60 * 90': 'phys::ticks(90.0f)',
            },
          }
          for p, rs in patches.items():
            s = p.read_text()
            for old, new in rs.items():
              if old not in s:
                raise SystemExit(f'missing expected pattern {old!r} in {p}')
              s = s.replace(old, new)
            p.write_text(s)
          print('native tick residuals fixed')
      - name: Commit and self-delete
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/native_tick_residual.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'remove final 60 Hz gameplay assumptions'
          git push origin HEAD:agent/gdlearn2-replace
