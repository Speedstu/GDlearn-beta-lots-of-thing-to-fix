name: fidelity v4 geometry probe
on: {push: {branches: [agent/gdlearn2-fidelity-v4], paths: [.github/workflows/fidelity_v4_probe.yml]}}
permissions: {contents: write}
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Wire explicit geometry tables
        shell: python
        run: |
          from pathlib import Path
          p=Path('tools/gmd_to_gdl.py');s=p.read_text()
          s=s.replace('from typing import Dict, Iterable, Optional, Tuple\n','from typing import Dict, Iterable, Optional, Tuple\nimport pathfinder_geometry as pg\n',1)
          old='''    scale = max(0.01, abs(_f(props, 32, 1.0)))\n    sx = max(0.01, abs(_f(props, 128, scale)))\n    sy = max(0.01, abs(_f(props, 129, scale)))\n'''
          new='''    scale = max(0.01, abs(_f(props, 32, 1.0)))\n    sx = scale * max(0.01, abs(_f(props, 128, 1.0)))\n    sy = scale * max(0.01, abs(_f(props, 129, 1.0)))\n'''
          if old not in s: raise SystemExit('scale anchor')
          s=s.replace(old,new,1)
          a=s.index('    if oid in HAZARD_IDS:')
          b=s.index('    return None',a)
          repl='''    if oid in pg.SAW_RADII:\n        r = pg.SAW_RADII[oid]\n        return GdlObject('hazard', 1, x, y, r * sx, r * sy, oid)\n    if oid in pg.HAZARD_SIZES:\n        w, h = pg.HAZARD_SIZES[oid]\n        hw, hh = _rotated_half_extents(0.5 * w * sx, 0.5 * h * sy, rot)\n        return GdlObject('hazard', 0, x, y, hw, hh, oid)\n    if oid in pg.BLOCK_SIZES:\n        w, h = pg.BLOCK_SIZES[oid]\n        hw, hh = _rotated_half_extents(0.5 * w * sx, 0.5 * h * sy, rot)\n        return GdlObject('solid', 0, x, y, hw, hh, oid)\n    # Slopes require triangular collision. Never turn them into full AABBs.\n'''
          s=s[:a]+repl+s[b:]
          p.write_text(s)

          p=Path('src/core/sim.cpp');s=p.read_text()
          anchor='''inline bool aabb(float ax, float ay, float ahw, float ahh, float bx, float by,\n                 float bhw, float bhh) {\n  return std::fabs(ax - bx) < (ahw + bhw) && std::fabs(ay - by) < (ahh + bhh);\n}\n'''
          helper=anchor+'''\ninline bool ellipseAabb(float ax, float ay, float ahw, float ahh,\n                        float ex, float ey, float rx, float ry) {\n  if (rx <= 0.0f || ry <= 0.0f) return false;\n  const float qx = std::clamp(ex, ax - ahw, ax + ahw);\n  const float qy = std::clamp(ey, ay - ahh, ay + ahh);\n  const float dx = (qx - ex) / rx, dy = (qy - ey) / ry;\n  return dx * dx + dy * dy <= 1.0f;\n}\n'''
          if anchor not in s: raise SystemExit('aabb anchor')
          s=s.replace(anchor,helper,1)
          old='''    if (o.kind != Kind::Hazard) continue;\n    if (aabb(st_.x, st_.y, lhw, lhh, o.x, o.y, o.hw, o.hh)) {\n'''
          new='''    if (o.kind != Kind::Hazard) continue;\n    const bool hit = o.sub == 1\n        ? ellipseAabb(st_.x, st_.y, hw, hh, o.x, o.y, o.hw, o.hh)\n        : aabb(st_.x, st_.y, lhw, lhh, o.x, o.y, o.hw, o.hh);\n    if (hit) {\n'''
          if old not in s: raise SystemExit('hazard collision anchor')
          s=s.replace(old,new,1)
          old='''    if (o.kind == Kind::Hazard && aabb(x, y, 0.5f, 0.5f, o.x, o.y, o.hw, o.hh))\n      return true;\n'''
          new='''    if (o.kind != Kind::Hazard) continue;\n    if (o.sub == 1) {\n      const float dx=(x-o.x)/std::max(0.001f,o.hw);\n      const float dy=(y-o.y)/std::max(0.001f,o.hh);\n      if (dx*dx+dy*dy <= 1.0f) return true;\n    } else if (aabb(x,y,0.5f,0.5f,o.x,o.y,o.hw,o.hh)) return true;\n'''
          if old not in s: raise SystemExit('hazardAt anchor')
          p.write_text(s.replace(old,new,1))
      - name: Build and exact replay probe
        shell: bash
        run: |
          set -euo pipefail
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j"$(nproc)"
          ./build/gdlearn selftest
          mkdir -p /tmp/l
          python3 tools/gmd_to_gdl.py levels/14.gmd -o /tmp/l/c.gdl --name Clubstep
          python3 tools/gmd_to_gdl.py levels/18.gmd -o /tmp/l/t.gdl --name 'Theory of Everything 2'
          python3 tools/gmd_to_gdl.py levels/20.gmd -o /tmp/l/d.gdl --name Deadlocked
          echo counts: C=$(grep -c '^o ' /tmp/l/c.gdl) T=$(grep -c '^o ' /tmp/l/t.gdl) D=$(grep -c '^o ' /tmp/l/d.gdl)
          set +e
          ./build/gdlearn solve /tmp/l/c.gdl --beam 24576 --widen 0 --max-frames 16000 --stall 8000 --out /tmp/c.macro | tee /tmp/c.log
          ./build/gdlearn solve /tmp/l/d.gdl --beam 24576 --widen 0 --max-frames 16000 --stall 8000 --out /tmp/d.macro | tee /tmp/d.log
          ./build/gdlearn solve /tmp/l/t.gdl --beam 24576 --widen 0 --max-frames 43200 --stall 12000 --out /tmp/t.macro | tee /tmp/t.log
          set -e
          python3 - <<'PY'
          import re,json
          def m(p):
            t=open(p).read();x=re.findall(r'(?:SOLVED|partial)\s+progress\s+([0-9.]+)%.*?verify\s+([0-9.]+)%',t)
            if not x: raise SystemExit('missing '+p)
            a,b=map(float,x[-1]);
            if abs(a-b)>.02: raise SystemExit('replay mismatch '+p)
            return a
          print('FIDELITY_V4',json.dumps({'club':m('/tmp/c.log'),'toe2':m('/tmp/t.log'),'dead':m('/tmp/d.log')},sort_keys=True))
          PY
      - name: Commit experiment branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/gmd_to_gdl.py tools/pathfinder_geometry.py src/core/sim.cpp
          git rm .github/workflows/fidelity_v4_probe.yml
          git commit -m 'use explicit classic GD geometry and circular saw collision'
          git push
