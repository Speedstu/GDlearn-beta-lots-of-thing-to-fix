name: fixed macro current v6
on:
  push:
    branches: [agent/gdlearn2-physics-v6]
    paths: [.github/workflows/fixed_macro_current_v6.yml]
permissions: {contents: write}
jobs:
  diff:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build -j2
      - run: ./build/gdlearn selftest
      - shell: bash
        run: |
          set -euo pipefail
          python3 tools/pathfinder_diff.py --bin ./build/gdlearn --frames 3000 --work /tmp/pf-fixed --macro diagnostics/pathfinder_reference.macro | tee /tmp/fixed.log
          mkdir -p diagnostics
          { echo "tested_head=$GITHUB_SHA"; cat /tmp/fixed.log; } > diagnostics/fixed_macro_current_v6.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add diagnostics/fixed_macro_current_v6.txt
          git commit -m 'record current fixed-macro Pathfinder diff' || true
          git push
