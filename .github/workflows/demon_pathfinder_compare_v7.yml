name: Demon Pathfinder compare v7
on:
  push:
    branches: [agent/gdlearn2-physics-v6]
    paths: [.github/workflows/demon_pathfinder_compare_v7.yml]
permissions: {contents: write}
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - shell: bash
        run: |
          set -euo pipefail
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release >/dev/null
          cmake --build build -j2 >/dev/null
          ./build/gdlearn selftest >/dev/null
          mkdir -p diagnostics/demons_v7 /tmp/dpf
          : > diagnostics/demons_v7/pathfinder_compare.txt

          run_one() {
            KEY="$1"; NUM="$2"; NAME="$3"; FRAMES="$4"
            echo "===== ${NAME} (${KEY}) =====" | tee -a diagnostics/demons_v7/pathfinder_compare.txt
            python3 tools/pathfinder_diff.py \
              --bin ./build/gdlearn \
              --gmd "levels/${NUM}.gmd" \
              --name "$NAME" \
              --frames "$FRAMES" \
              --work "/tmp/dpf/${KEY}" \
              --macro "diagnostics/demons_v7/${KEY}.macro" \
              | tee "/tmp/dpf/${KEY}.log"
            grep -E '^(PATHFINDER_REF|MACRO_SOURCE|FIRST_DIVERGENCE|FRAMES)' "/tmp/dpf/${KEY}.log" \
              | tee -a diagnostics/demons_v7/pathfinder_compare.txt
            echo >> diagnostics/demons_v7/pathfinder_compare.txt
          }

          run_one clubstep 14 "Clubstep" 10000
          run_one toe2 18 "Theory of Everything 2" 6000
          run_one deadlocked 20 "Deadlocked" 5000

          cat diagnostics/demons_v7/pathfinder_compare.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add diagnostics/demons_v7/pathfinder_compare.txt
          git commit -m 'record Pathfinder comparison for current demon blockers'
          git push
