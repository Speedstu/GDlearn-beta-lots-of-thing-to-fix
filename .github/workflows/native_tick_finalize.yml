name: one-shot native tick finalizer

on:
  push:
    branches: [agent/gdlearn2-replace]
    paths: [.github/workflows/native_tick_finalize.yml]

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Replace remaining legacy real-time constants
        shell: python
        run: |
          from pathlib import Path

          replacements = {
              '60 * 400': 'phys::ticks(400.0f)',
              '60 * 180': 'phys::ticks(180.0f)',
              '60 * 60': 'phys::ticks(60.0f)',
              '60 * 15': 'phys::ticks(15.0f)',
              '60 * 12': 'phys::ticks(12.0f)',
              '60 * 8': 'phys::ticks(8.0f)',
              '60 * 4': 'phys::ticks(4.0f)',
          }
          changed = []
          for p in Path('src').rglob('*'):
              if p.suffix not in {'.cpp', '.hpp'}:
                  continue
              text = p.read_text()
              old = text
              for a, b in replacements.items():
                  text = text.replace(a, b)
              text = text.replace('frames < 120', 'frames < phys::ticks(2.0f)')
              text = text.replace('steps / sec / 60.0',
                                  'steps / sec / static_cast<double>(phys::TPS)')
              if p.as_posix() == 'src/rl/curriculum.cpp':
                  text = text.replace(') + 600;', ') + phys::ticks(10.0f);')
              if text != old:
                  p.write_text(text)
                  changed.append(str(p))
          print('changed:', *changed, sep='\n  ')

          # This workflow handles explicit real-time constants only. Any new
          # suspicious literal is printed for review instead of blindly edited.
          for p in Path('src').rglob('*'):
              if p.suffix not in {'.cpp', '.hpp'}:
                  continue
              for n, line in enumerate(p.read_text().splitlines(), 1):
                  if '60 *' in line or '* 60' in line:
                      print(f'REMAINING {p}:{n}: {line}')
      - name: Remove this one-shot workflow and commit
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/native_tick_finalize.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'finish native 240 TPS timing migration'
          git push origin HEAD:agent/gdlearn2-replace
