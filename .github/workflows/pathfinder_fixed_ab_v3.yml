name: Pathfinder current oracle v3
on:
  push:
    branches: [agent/gdlearn2-physics-v6]
    paths:
      - .github/workflows/pathfinder_fixed_ab_v3.yml
      - tools/pathfinder_diff.py
      - src/core/sim.cpp
      - src/core/physics.hpp
      - src/core/slope_collision.hpp
      - tools/gmd_to_gdl.py
      - tools/pathfinder_geometry.py
permissions:
  contents: write
jobs:
  oracle:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: run observable oracle
        shell: bash
        run: |
          set +e
          mkdir -p diagnostics
          : > /tmp/oracle.log

          echo '=== CONFIGURE ===' | tee -a /tmp/oracle.log
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release >>/tmp/oracle.log 2>&1
          CONFIGURE_RC=$?
          echo "CONFIGURE_RC=$CONFIGURE_RC" | tee -a /tmp/oracle.log

          BUILD_RC=99
          SELFTEST_RC=99
          DIFF_RC=99
          if [ "$CONFIGURE_RC" -eq 0 ]; then
            echo '=== BUILD ===' | tee -a /tmp/oracle.log
            cmake --build build -j2 >>/tmp/oracle.log 2>&1
            BUILD_RC=$?
            echo "BUILD_RC=$BUILD_RC" | tee -a /tmp/oracle.log
          fi

          if [ "$BUILD_RC" -eq 0 ]; then
            echo '=== SELFTEST ===' | tee -a /tmp/oracle.log
            ./build/gdlearn selftest >>/tmp/oracle.log 2>&1
            SELFTEST_RC=$?
            echo "SELFTEST_RC=$SELFTEST_RC" | tee -a /tmp/oracle.log
          fi

          if [ "$SELFTEST_RC" -eq 0 ]; then
            echo '=== PATHFINDER DIFF ===' | tee -a /tmp/oracle.log
            python3 tools/pathfinder_diff.py \
              --bin ./build/gdlearn \
              --beam 6144 --frames 3000 \
              --work /tmp/pf-current \
              --save-macro diagnostics/pathfinder_reference.macro \
              >>/tmp/oracle.log 2>&1
            DIFF_RC=$?
            echo "DIFF_RC=$DIFF_RC" | tee -a /tmp/oracle.log
          fi

          python3 - <<'PY'
          import os,pathlib,re
          t=pathlib.Path('/tmp/oracle.log').read_text()
          def rc(name):
              m=re.findall(rf'{name}_RC=(-?\d+)',t)
              return int(m[-1]) if m else -999
          m=re.search(r'FIRST_DIVERGENCE \((\d+),',t)
          tick=int(m.group(1)) if m else -1
          header=(
              f'tested_head={os.environ.get("GITHUB_SHA","")}\n'
              f'configure_rc={rc("CONFIGURE")}\n'
              f'build_rc={rc("BUILD")}\n'
              f'selftest_rc={rc("SELFTEST")}\n'
              f'diff_rc={rc("DIFF")}\n'
              f'first_divergence={tick}\n\n')
          pathlib.Path('diagnostics/pathfinder_current.txt').write_text(header+t)
          print(header)
          PY

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add diagnostics/pathfinder_current.txt
          [ -f diagnostics/pathfinder_reference.macro ] && git add diagnostics/pathfinder_reference.macro
          git commit -m 'record observable Pathfinder oracle' || true
          git push
          exit 0
