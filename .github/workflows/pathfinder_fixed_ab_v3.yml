name: Pathfinder current oracle v3
on:
  push:
    branches: [agent/gdlearn2-physics-v6]
    paths:
      - .github/workflows/pathfinder_fixed_ab_v3.yml
      - tools/pathfinder_diff.py
      - src/core/sim.cpp
      - src/core/physics.hpp
      - src/core/slope_collision.hpp
      - tools/gmd_to_gdl.py
      - tools/pathfinder_geometry.py
permissions:
  contents: write
jobs:
  oracle:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: build and selftest
        shell: bash
        run: |
          set -euo pipefail
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release >/dev/null
          cmake --build build -j2 >/dev/null
          ./build/gdlearn selftest
      - name: current differential
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p diagnostics
          python3 tools/pathfinder_diff.py \
            --bin ./build/gdlearn \
            --beam 6144 --frames 3000 \
            --work /tmp/pf-current \
            --save-macro diagnostics/pathfinder_reference.macro \
            | tee /tmp/current.log
          python3 - <<'PY'
          import os,pathlib,re
          t=pathlib.Path('/tmp/current.log').read_text()
          m=re.search(r'FIRST_DIVERGENCE \((\d+),',t)
          tick=int(m.group(1)) if m else -1
          pathlib.Path('diagnostics/pathfinder_current.txt').write_text(
              f'tested_head={os.environ.get("GITHUB_SHA","")}\n'
              f'first_divergence={tick}\n\n'+t)
          print('CURRENT_FIRST_DIVERGENCE',tick)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add diagnostics/pathfinder_reference.macro diagnostics/pathfinder_current.txt
          git commit -m 'record current Pathfinder oracle' || true
          git push
