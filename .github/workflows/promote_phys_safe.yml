name: promote validated physics fixes

on:
  push:
    branches:
      - agent/gdlearn2-final
    paths:
      - .github/workflows/promote_phys_safe.yml

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply validated simulator fixes
        shell: python
        run: |
          from pathlib import Path

          p = Path('src/core/sim.cpp')
          s = p.read_text()

          old = '''    if (st_.flip) {\n      float flipRef = level_->floorY + 2.0f * phys::FLIGHT_CEILING;\n'''
          new = '''    if (st_.flip && isFlightMode(st_.mode)) {\n      float flipRef = level_->floorY + 2.0f * phys::FLIGHT_CEILING;\n'''
          if old not in s:
              raise SystemExit('flight-only anchor missing')
          s = s.replace(old, new, 1)

          anchor = '''  const float lhw = hw * (1.0f - phys::HITBOX_LETHAL_SCALE);\n  const float lhh = hh * (1.0f - phys::HITBOX_LETHAL_SCALE);\n'''
          repl = anchor + '''  // Solid sides use the compact inner player hitbox.  Hazards keep\n  // their separately tuned lethal box above.\n  const float bhw = hw * phys::HITBOX_LETHAL_SCALE;\n  const float bhh = hh * phys::HITBOX_LETHAL_SCALE;\n'''
          if anchor not in s:
              raise SystemExit('inner-box declaration anchor missing')
          s = s.replace(anchor, repl, 1)

          wall = '''    } else if (aabb(st_.x, st_.y, lhw, lhh, o.x, o.y, o.hw, o.hh)) {\n      // Ran into the wall for real: that is a death in GD, not a slide.\n'''
          wall2 = '''    } else if (aabb(st_.x, st_.y, bhw, bhh, o.x, o.y, o.hw, o.hh)) {\n      // Ran into the wall for real: that is a death in GD, not a slide.\n'''
          if wall not in s:
              raise SystemExit('solid-side anchor missing')
          s = s.replace(wall, wall2, 1)
          p.write_text(s)

          p = Path('src/app/main.cpp')
          s = p.read_text()
          anchor = '''  // 3. Determinism: same inputs => bit-identical state.\n'''
          test = '''  // Regression: the dynamic flight corridor ceiling is ONLY for flight\n  // modes. A gravity-flipped cube used to be snapped from y~650 to y=600,\n  // which let beam search travel through official levels below/through geometry.\n  {\n    Sim sim(&flat);\n    State st = sim.state();\n    st.mode = Mode::Cube;\n    st.flip = true;\n    st.y = 650.0f;\n    st.vy = 0.0f;\n    st.onGround = false;\n    sim.restore(st);\n    sim.step(false);\n    check(sim.state().y > 620.0f,\n          "flipped cube is never clamped by flight corridor ceiling");\n  }\n\n  // 3. Determinism: same inputs => bit-identical state.\n'''
          if anchor not in s:
              raise SystemExit('selftest anchor missing')
          s = s.replace(anchor, test, 1)
          p.write_text(s)

      - name: Build and gate corrected baseline
        shell: bash
        run: |
          set -euo pipefail
          cmake -S . -B /tmp/build -DCMAKE_BUILD_TYPE=Release
          cmake --build /tmp/build -j"$(nproc)"
          /tmp/build/gdlearn selftest
          mkdir -p /tmp/l /tmp/log
          python3 tools/gmd_to_gdl.py levels/14.gmd -o /tmp/l/c.gdl --name Clubstep
          python3 tools/gmd_to_gdl.py levels/18.gmd -o /tmp/l/t.gdl --name 'Theory of Everything 2'
          python3 tools/gmd_to_gdl.py levels/20.gmd -o /tmp/l/d.gdl --name Deadlocked
          set +e
          /tmp/build/gdlearn solve /tmp/l/c.gdl --beam 96 --widen 0 --max-frames 43200 --stall 3000 --out /tmp/c.macro | tee /tmp/log/c.log
          /tmp/build/gdlearn solve /tmp/l/t.gdl --beam 32768 --widen 0 --max-frames 43200 --stall 12000 --out /tmp/t.macro | tee /tmp/log/t.log
          /tmp/build/gdlearn solve /tmp/l/d.gdl --beam 96 --widen 0 --max-frames 43200 --stall 3000 --out /tmp/d.macro | tee /tmp/log/d.log
          set -e
          grep -q 'progress 9.30%' /tmp/log/c.log
          grep -q 'progress 2.36%' /tmp/log/t.log
          grep -q 'progress 1.83%' /tmp/log/d.log

      - name: Commit validated source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/core/sim.cpp src/app/main.cpp
          git rm .github/workflows/promote_phys_safe.yml
          git commit -m 'fix gravity-flip ceiling and solid inner hitbox'
          git push
