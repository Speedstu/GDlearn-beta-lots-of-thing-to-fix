name: slope v5
on: {push: {branches: [agent/gdlearn2-fidelity-v4], paths: [.github/workflows/slope_v5.yml]}}
permissions: {contents: write}
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Apply, build, selftest
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/apply_slope_v5.py
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j"$(nproc)"
          ./build/gdlearn selftest
      - name: Convert and static-ceiling search
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/l /tmp/static
          python3 tools/gmd_to_gdl.py levels/14.gmd -o /tmp/l/c.gdl --name Clubstep
          python3 tools/gmd_to_gdl.py levels/18.gmd -o /tmp/l/t.gdl --name 'Theory of Everything 2'
          python3 tools/gmd_to_gdl.py levels/20.gmd -o /tmp/l/d.gdl --name Deadlocked
          echo objects C=$(grep -c '^o ' /tmp/l/c.gdl) T=$(grep -c '^o ' /tmp/l/t.gdl) D=$(grep -c '^o ' /tmp/l/d.gdl)
          set +e
          for k in c t d; do ./build/gdlearn solve /tmp/l/$k.gdl --beam 6144 --widen 0 --max-frames 12000 --stall 6000 --out /tmp/static/$k.macro | tee /tmp/static/$k.log; done
          set -e
          python3 - <<'PY'
          import re
          for k in 'ctd':
            x=re.findall(r'(?:SOLVED|partial)\s+progress\s+([0-9.]+)%.*?verify\s+([0-9.]+)%',open('/tmp/static/'+k+'.log').read())
            if not x: raise SystemExit('missing '+k)
            a,b=map(float,x[-1]); print('V5_STATIC',k,a,b)
            if abs(a-b)>.02: raise SystemExit('replay mismatch '+k)
          PY
      - name: No-global-ceiling containment A-B
        shell: bash
        run: |
          set -euo pipefail
          cp src/core/sim.cpp /tmp/sim.cpp
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/core/sim.cpp');s=p.read_text();old='if (st_.y < phys::KILL_BELOW || st_.y > phys::CEILING_Y) st_.dead = true;';new='if (st_.y < phys::KILL_BELOW) st_.dead = true;'
          if old not in s: raise SystemExit('ceiling anchor')
          p.write_text(s.replace(old,new,1))
          PY
          cmake -S . -B /tmp/noc-build -DCMAKE_BUILD_TYPE=Release >/dev/null
          cmake --build /tmp/noc-build -j"$(nproc)" >/dev/null
          mkdir -p /tmp/noc
          set +e
          for k in c t d; do /tmp/noc-build/gdlearn solve /tmp/l/$k.gdl --beam 6144 --widen 0 --max-frames 18000 --stall 8000 --out /tmp/noc/$k.macro | tee /tmp/noc/$k.log; /tmp/noc-build/gdlearn trace /tmp/l/$k.gdl --macro /tmp/noc/$k.macro --frames 18000 > /tmp/noc/$k.trace; done
          set -e
          python3 - <<'PY'
          import re
          escaped=[]
          for k in 'ctd':
            x=re.findall(r'(?:SOLVED|partial)\s+progress\s+([0-9.]+)%.*?verify\s+([0-9.]+)%',open('/tmp/noc/'+k+'.log').read()); a,b=map(float,x[-1])
            ys=[]
            for l in open('/tmp/noc/'+k+'.trace'):
              p=l.split()
              if len(p)>=4 and p[0].isdigit():
                try: ys.append(float(p[3])*30.0)
                except: pass
            lo=min(ys) if ys else 0; hi=max(ys) if ys else 0
            print('V5_NOCEILING',k,'progress',a,'verify',b,'miny',lo,'maxy',hi)
            if abs(a-b)>.02: raise SystemExit('replay mismatch '+k)
            if max(abs(lo),abs(hi))>10000: escaped.append(k)
          if escaped: print('CEILING_STILL_REQUIRED_FOR',','.join(escaped))
          else: print('NATURAL_VERTICAL_CONTAINMENT_OK')
          PY
          cp /tmp/sim.cpp src/core/sim.cpp
      - name: Commit slope support
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/core/sim.cpp src/core/slope_collision.hpp tools/gmd_to_gdl.py tools/pathfinder_geometry.py
          git rm tools/apply_slope_v5.py .github/workflows/slope_v5.yml
          git commit -m 'add analytic triangular slope collision fidelity'
          git push
