name: inspect official demon blocker regions

on:
  push:
    branches:
      - agent/gdlearn2-replace
    paths:
      - .github/workflows/inspect_blockers.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Deadlocked exact-hazard early blocker neighborhood
        run: python3 tools/inspect_gmd_region.py levels/20.gmd --x 830 --radius 220
      - name: Theory of Everything 2 early blocker neighborhood
        run: python3 tools/inspect_gmd_region.py levels/18.gmd --x 466 --radius 220
