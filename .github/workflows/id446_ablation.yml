name: ID446 spike hitbox ablation

on:
  push:
    branches:
      - agent/gdlearn2-final
    paths:
      - .github/workflows/id446_ablation.yml

permissions:
  contents: read

jobs:
  ablate:
    strategy:
      fail-fast: false
      matrix:
        mode:
          - exact446
          - ignore446
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Apply isolated ID446 change
        env:
          MODE: ${{ matrix.mode }}
        shell: python
        run: |
          import os
          from pathlib import Path
          p=Path('tools/gmd_to_gdl.py'); s=p.read_text()
          anchor="""    if oid in HAZARD_IDS:\n        hw, hh = _rotated_half_extents(4.0 * sx, 8.0 * sy, rot)\n        return GdlObject('hazard', 0, x, y, hw, hh, oid)\n"""
          if anchor not in s: raise SystemExit('hazard classifier anchor missing')
          if os.environ['MODE']=='exact446':
              repl="""    if oid == 446:\n        # Classic ID446 factual lethal box: full size 9 x 7.2.\n        hw, hh = _rotated_half_extents(4.5 * sx, 3.6 * sy, rot)\n        return GdlObject('hazard', 0, x, y, hw, hh, oid)\n""" + anchor
          else:
              repl="""    if oid == 446:\n        return None\n""" + anchor
          p.write_text(s.replace(anchor,repl,1))
      - name: Build and measure
        shell: bash
        run: |
          set -euo pipefail
          cmake -S . -B /tmp/build -DCMAKE_BUILD_TYPE=Release
          cmake --build /tmp/build -j"$(nproc)"
          mkdir -p /tmp/l
          python3 tools/gmd_to_gdl.py levels/14.gmd -o /tmp/l/c.gdl --name Clubstep
          python3 tools/gmd_to_gdl.py levels/18.gmd -o /tmp/l/t.gdl --name 'Theory of Everything 2'
          python3 tools/gmd_to_gdl.py levels/20.gmd -o /tmp/l/d.gdl --name Deadlocked
          set +e
          echo "=== MODE ${{ matrix.mode }} ==="
          for k in c t d; do /tmp/build/gdlearn solve /tmp/l/$k.gdl --beam 96 --widen 0 --max-frames 43200 --stall 2400 --out /tmp/$k.macro; done
          /tmp/build/gdlearn solve /tmp/l/t.gdl --beam 1536 --widen 0 --max-frames 30000 --stall 6000 --out /tmp/t1536.macro
          set -e
