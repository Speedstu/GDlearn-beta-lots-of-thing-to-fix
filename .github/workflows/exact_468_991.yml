name: exact 468 991 hitboxes

on:
  push:
    branches: [agent/gdlearn2-hitboxes-v2]
    paths: [.github/workflows/exact_468_991.yml]

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch exact dimensions from Pathfinder
        shell: python
        run: |
          from pathlib import Path
          p=Path('tools/gmd_to_gdl.py'); s=p.read_text()
          old='''    if oid in HAZARD_IDS:\n        hw, hh = _rotated_half_extents(4.0 * sx, 8.0 * sy, rot)\n        return GdlObject('hazard', 0, x, y, hw, hh, oid)\n    if oid in SOLID_IDS:\n        hw, hh = _rotated_half_extents(15.0 * sx, 15.0 * sy, rot)\n        return GdlObject('solid', 0, x, y, hw, hh, oid)\n'''
          new='''    if oid in HAZARD_IDS:\n        if oid == 991:\n            bhw, bhh = 2.40039063 * 0.5 * sx, 3.20001221 * 0.5 * sy\n        else:\n            bhw, bhh = 4.0 * sx, 8.0 * sy\n        hw, hh = _rotated_half_extents(bhw, bhh, rot)\n        return GdlObject('hazard', 0, x, y, hw, hh, oid)\n    if oid in SOLID_IDS:\n        if oid == 468:\n            bhw, bhh = 15.0 * sx, 0.75 * sy\n        else:\n            bhw, bhh = 15.0 * sx, 15.0 * sy\n        hw, hh = _rotated_half_extents(bhw, bhh, rot)\n        return GdlObject('solid', 0, x, y, hw, hh, oid)\n'''
          if old not in s: raise SystemExit('classification anchor missing')
          p.write_text(s.replace(old,new,1))
      - name: Build and validate converted target families
        shell: bash
        run: |
          set -euo pipefail
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j"$(nproc)"
          ./build/gdlearn selftest
          python3 tools/gmd_to_gdl.py levels/18.gmd -o /tmp/t.gdl --name 'Theory of Everything 2'
          python3 tools/gmd_to_gdl.py levels/20.gmd -o /tmp/d.gdl --name Deadlocked
          python3 - <<'PY'
          def rows(path, oid):
              out=[]
              for line in open(path):
                  p=line.split()
                  if len(p)==8 and p[0]=='o' and int(p[7])==oid:
                      out.append((float(p[5]),float(p[6])))
              return out
          r468=rows('/tmp/t.gdl',468); r991=rows('/tmp/d.gdl',991)
          print('468 sample',r468[:10]); print('991 sample',r991[:10])
          if not r468 or not r991: raise SystemExit('target IDs absent')
          # At least one unit-scale example must expose the measured dimensions.
          if not any(abs(min(a,b)-0.75)<0.02 and abs(max(a,b)-15.0)<0.05 for a,b in r468):
              raise SystemExit('no measured unit-scale 468 slab found')
          if not any(abs(min(a,b)-1.200195)<0.03 and abs(max(a,b)-1.600006)<0.03 for a,b in r991):
              raise SystemExit('no measured unit-scale 991 hazard found')
          PY
      - name: Exact-search A/B gates
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/gmd_to_gdl.py levels/14.gmd -o /tmp/c.gdl --name Clubstep
          set +e
          ./build/gdlearn solve /tmp/c.gdl --beam 6144 --widen 0 --max-frames 12000 --stall 6000 --out /tmp/c.macro | tee /tmp/c.log
          ./build/gdlearn solve /tmp/d.gdl --beam 6144 --widen 0 --max-frames 12000 --stall 6000 --out /tmp/d.macro | tee /tmp/d.log
          ./build/gdlearn solve /tmp/t.gdl --beam 24576 --widen 0 --max-frames 43200 --stall 12000 --out /tmp/t.macro | tee /tmp/t.log
          set -e
          python3 - <<'PY'
          import re
          def metric(p):
              t=open(p).read(); m=re.findall(r'(?:SOLVED|partial)\s+progress\s+([0-9.]+)%.*?verify\s+([0-9.]+)%',t)
              if not m: raise SystemExit('missing '+p)
              a,b=map(float,m[-1])
              if abs(a-b)>0.02: raise SystemExit('replay mismatch '+p)
              return a
          r={'club':metric('/tmp/c.log'),'dead':metric('/tmp/d.log'),'toe2':metric('/tmp/t.log')}
          print('EXACT_468_991',r)
          if r['club'] < 8.5: raise SystemExit('Clubstep regression')
          if r['dead'] <= 6.75: raise SystemExit('ID991 exact box did not improve Deadlocked')
          if r['toe2'] <= 70.38: raise SystemExit('ID468 exact slab did not improve ToE2')
          PY
      - name: Promote exact dimensions
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/gmd_to_gdl.py
          git rm .github/workflows/exact_468_991.yml
          git commit -m 'use measured hitboxes for GD IDs 468 and 991'
          git push
