name: probe GD level source

on:
  push:
    branches:
      - agent/gdlearn2-replace
    paths:
      - .github/workflows/probe_level_source.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Fetch and convert The Nightmare with current 2.2 protocol
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/fetch_gd_level.py --name 'The Nightmare' --out /tmp/real
          test -s /tmp/real/13519.gdl
          grep '^name ' /tmp/real/13519.gdl
          N="$(grep -c '^o ' /tmp/real/13519.gdl)"
          echo "gameplay objects=$N"
          test "$N" -gt 20
