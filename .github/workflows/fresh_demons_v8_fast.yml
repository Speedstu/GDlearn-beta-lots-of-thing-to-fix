# concurrency-safe diagnostics push
name: fresh demons v8 fast probe
on:
  push:
    branches: [agent/gdlearn2-physics-v6]
    paths: [.github/workflows/fresh_demons_v8_fast.yml]
permissions: {contents: write}
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build -j2
      - run: ./build/gdlearn selftest
      - shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/dv8f diagnostics/demons_v8_fast
          : > diagnostics/fresh_demons_v8_fast.txt
          echo "head=$GITHUB_SHA beam=8192" >> diagnostics/fresh_demons_v8_fast.txt
          run_one() {
            NUM="$1"; NAME="$2"; KEY="$3"
            python3 tools/gmd_to_gdl.py "levels/${NUM}.gmd" -o "/tmp/dv8f/${KEY}.gdl" --name "$NAME" >/dev/null
            set +e
            ./build/gdlearn solve "/tmp/dv8f/${KEY}.gdl" --beam 8192 --widen 0 --max-frames 50000 --stall 8000 --out "diagnostics/demons_v8_fast/${KEY}.macro" > "/tmp/dv8f/${KEY}.log" 2>&1
            RC=$?
            set -e
            ./build/gdlearn trace "/tmp/dv8f/${KEY}.gdl" --macro "diagnostics/demons_v8_fast/${KEY}.macro" --frames 50000 > "/tmp/dv8f/${KEY}.trace" 2>&1 || true
            { echo "===== $NAME ===== rc=$RC"; tail -n 10 "/tmp/dv8f/${KEY}.log"; tail -n 4 "/tmp/dv8f/${KEY}.trace"; echo; } >> diagnostics/fresh_demons_v8_fast.txt
          }
          run_one 14 Clubstep clubstep
          run_one 18 'Theory of Everything 2' toe2
          run_one 20 Deadlocked deadlocked
          cat diagnostics/fresh_demons_v8_fast.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add diagnostics/fresh_demons_v8_fast.txt diagnostics/demons_v8_fast/*.macro
          git commit -m 'record fast v8 demon probe' || true
          git pull --rebase origin agent/gdlearn2-physics-v6
          git push
