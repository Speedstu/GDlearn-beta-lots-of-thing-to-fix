name: toe2 v5 screen
on: {push: {branches: [agent/gdlearn2-fidelity-v4], paths: [.github/workflows/toe2_v5_screen.yml]}}
permissions: {contents: write}
jobs:
  s:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - shell: bash
        run: |
          set -euo pipefail
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release >/dev/null; cmake --build build -j"$(nproc)" >/dev/null
          mkdir -p diagnostics/v5
          python3 tools/gmd_to_gdl.py levels/18.gmd -o /tmp/t.gdl --name 'Theory of Everything 2'
          set +e; ./build/gdlearn solve /tmp/t.gdl --beam 6144 --widen 0 --max-frames 10000 --stall 5000 --out /tmp/t.macro | tee diagnostics/v5/toe2.log; set -e
          ./build/gdlearn trace /tmp/t.gdl --macro /tmp/t.macro --frames 10000 > diagnostics/v5/toe2.trace
          ./build/gdlearn render /tmp/t.gdl /tmp/t.macro --out diagnostics/v5/toe2.html --max-frames 10000 >/dev/null
          python3 - <<'PY'
          from pathlib import Path
          p=Path('diagnostics/v5/toe2.html');s=p.read_text();n='resize();\nrequestAnimationFrame(tick);'
          if n in s:s=s.replace(n,"i=Math.max(0,tr.length-1);document.getElementById('scrub').value=i;resize();\nrequestAnimationFrame(tick);",1)
          p.write_text(s)
          PY
          B="$(command -v google-chrome || command -v chromium || true)"; if [ -n "$B" ]; then "$B" --headless --no-sandbox --disable-gpu --hide-scrollbars --window-size=1600,900 --screenshot=diagnostics/v5/toe2.png "file://$PWD/diagnostics/v5/toe2.html" >/dev/null 2>&1 || true; fi
          tail -n 30 diagnostics/v5/toe2.trace
          git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'; git add diagnostics/v5; git rm .github/workflows/toe2_v5_screen.yml; git commit -m 'add ToE2 v5 failure screenshot and trace'; git push
