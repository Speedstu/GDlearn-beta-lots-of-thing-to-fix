name: measured interactives A-B

on:
  push:
    branches: [agent/gdlearn2-interactives-v2]
    paths: [.github/workflows/interactives_exact.yml]

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply measured interactive dimensions
        shell: python
        run: |
          from pathlib import Path
          p=Path('tools/gmd_to_gdl.py'); s=p.read_text()
          old='''    if oid in PORTALS:\n        return GdlObject('portal', PORTALS[oid], x, y, 12.0 * sx, 45.0 * sy, oid)\n    if oid in SPEEDS:\n        return GdlObject('speed', SPEEDS[oid], x, y, 10.0 * sx, 20.0 * sy, oid)\n    if oid in PADS:\n        return GdlObject('pad', PADS[oid], x, y, 15.0 * sx, 5.0 * sy, oid)\n'''
          new='''    if oid in PORTALS:\n        if oid in (12, 13, 47, 111, 660):\n            pw, ph = 17.0, 43.0\n        elif oid in (10, 11):\n            pw, ph = 12.5, 37.5\n        elif oid in (99, 101):\n            pw, ph = 15.5, 45.0\n        else:\n            pw, ph = 12.0, 45.0\n        return GdlObject('portal', PORTALS[oid], x, y, pw * sx, ph * sy, oid)\n    if oid in SPEEDS:\n        dims = {200:(17.5,22.0), 201:(16.5,28.0), 202:(25.5,28.0),\n                203:(32.5,28.0), 1334:(34.5,28.0)}\n        pw, ph = dims.get(oid, (10.0,20.0))\n        return GdlObject('speed', SPEEDS[oid], x, y, pw * sx, ph * sy, oid)\n    if oid in PADS:\n        dims = {35:(12.5,2.0), 140:(12.5,2.5), 67:(12.5,3.0)}\n        pw, ph = dims.get(oid, (15.0,5.0))\n        return GdlObject('pad', PADS[oid], x, y, pw * sx, ph * sy, oid)\n'''
          if old not in s: raise SystemExit('interactive anchor missing')
          p.write_text(s.replace(old,new,1))
      - name: Build and solve
        shell: bash
        run: |
          set -euo pipefail
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j"$(nproc)"
          ./build/gdlearn selftest
          mkdir -p /tmp/l
          python3 tools/gmd_to_gdl.py levels/14.gmd -o /tmp/l/c.gdl --name Clubstep
          python3 tools/gmd_to_gdl.py levels/18.gmd -o /tmp/l/t.gdl --name 'Theory of Everything 2'
          python3 tools/gmd_to_gdl.py levels/20.gmd -o /tmp/l/d.gdl --name Deadlocked
          set +e
          ./build/gdlearn solve /tmp/l/c.gdl --beam 6144 --widen 0 --max-frames 12000 --stall 6000 --out /tmp/c.macro | tee /tmp/c.log
          ./build/gdlearn solve /tmp/l/t.gdl --beam 1536 --widen 0 --max-frames 20000 --stall 8000 --out /tmp/t.macro | tee /tmp/t.log
          ./build/gdlearn solve /tmp/l/d.gdl --beam 6144 --widen 0 --max-frames 12000 --stall 6000 --out /tmp/d.macro | tee /tmp/d.log
          set -e
          python3 - <<'PY'
          import re
          def m(p):
              t=open(p).read(); x=re.findall(r'(?:SOLVED|partial)\s+progress\s+([0-9.]+)%.*?verify\s+([0-9.]+)%',t)
              a,b=map(float,x[-1]);
              if abs(a-b)>.02: raise SystemExit('replay mismatch')
              return a
          r={'club':m('/tmp/c.log'),'toe2':m('/tmp/t.log'),'dead':m('/tmp/d.log')}
          print('MEASURED_INTERACTIVES',r)
          if r['club'] < 9.0 or r['toe2'] < 30.0 or r['dead'] < 5.0: raise SystemExit('severe regression')
          PY
      - name: Promote if non-regressive
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/gmd_to_gdl.py
          git rm .github/workflows/interactives_exact.yml
          git commit -m 'use measured classic interactive hitboxes'
          git push
