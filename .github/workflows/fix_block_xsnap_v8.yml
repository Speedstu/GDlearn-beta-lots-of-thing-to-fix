# observable X-snap experiment
name: fix block X-snap v8
on:
  push:
    branches: [agent/gdlearn2-physics-v6]
    paths: [.github/workflows/fix_block_xsnap_v8.yml]
permissions: {contents: write}
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: test X-snap and always persist result
        shell: bash
        run: |
          set +e
          mkdir -p diagnostics
          : > /tmp/xsnap.log
          python3 tools/apply_block_xsnap_v8.py >>/tmp/xsnap.log 2>&1
          PATCH_RC=$?
          CONFIGURE_RC=99; BUILD_RC=99; SELFTEST_RC=99; DIFF_RC=99; TICK=-1
          if [ "$PATCH_RC" -eq 0 ]; then
            cmake -S . -B build -DCMAKE_BUILD_TYPE=Release >>/tmp/xsnap.log 2>&1
            CONFIGURE_RC=$?
          fi
          if [ "$CONFIGURE_RC" -eq 0 ]; then
            cmake --build build -j2 >>/tmp/xsnap.log 2>&1
            BUILD_RC=$?
          fi
          if [ "$BUILD_RC" -eq 0 ]; then
            ./build/gdlearn selftest >>/tmp/xsnap.log 2>&1
            SELFTEST_RC=$?
          fi
          if [ "$SELFTEST_RC" -eq 0 ]; then
            python3 tools/pathfinder_diff.py --bin ./build/gdlearn --gmd levels/14.gmd --name Clubstep --frames 12000 --work /tmp/pf-xsnap --macro diagnostics/demons_v8_fast/clubstep.macro >>/tmp/xsnap.log 2>&1
            DIFF_RC=$?
            TICK=$(python3 - <<'PY'
          import pathlib,re
          t=pathlib.Path('/tmp/xsnap.log').read_text(); m=re.search(r'FIRST_DIVERGENCE \((\d+),',t)
          print(int(m.group(1)) if m else 999999)
          PY
            )
          fi
          {
            echo "tested_head=$GITHUB_SHA"
            echo "patch_rc=$PATCH_RC"
            echo "configure_rc=$CONFIGURE_RC"
            echo "build_rc=$BUILD_RC"
            echo "selftest_rc=$SELFTEST_RC"
            echo "diff_rc=$DIFF_RC"
            echo "first_divergence=$TICK"
            echo
            cat /tmp/xsnap.log
          } > diagnostics/block_xsnap_v8.txt
          cat diagnostics/block_xsnap_v8.txt

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if [ "$PATCH_RC" -eq 0 ] && [ "$CONFIGURE_RC" -eq 0 ] && [ "$BUILD_RC" -eq 0 ] && [ "$SELFTEST_RC" -eq 0 ] && [ "$DIFF_RC" -eq 0 ] && [ "$TICK" -gt 1004 ]; then
            git add src/core/sim.hpp src/core/sim.cpp src/search/beam.cpp src/app/main.cpp diagnostics/block_xsnap_v8.txt
            git commit -m 'match Pathfinder cube staircase X-snapping' || true
          else
            git checkout -- src/core/sim.hpp src/core/sim.cpp src/search/beam.cpp src/app/main.cpp
            git add diagnostics/block_xsnap_v8.txt
            git commit -m 'record failed block X-snap experiment' || true
          fi
          git pull --rebase origin agent/gdlearn2-physics-v6
          git push
          exit 0
