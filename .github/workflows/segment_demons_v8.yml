# concurrency-safe diagnostics push
name: segment repair demons v8
on:
  push:
    branches: [agent/gdlearn2-physics-v6]
    paths:
      - .github/workflows/segment_demons_v8.yml
      - diagnostics/demons_v8/*.macro
permissions: {contents: write}
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - shell: bash
        run: |
          set -euo pipefail
          for f in diagnostics/demons_v8/clubstep.macro diagnostics/demons_v8/toe2.macro diagnostics/demons_v8/deadlocked.macro; do
            if [ ! -f "$f" ]; then echo 'v8 macros not ready'; exit 0; fi
          done
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release >/dev/null
          cmake --build build -j2 >/dev/null
          ./build/gdlearn selftest >/dev/null
          mkdir -p /tmp/segv8 diagnostics/demons_v8_segmented
          : > diagnostics/segment_demons_v8.txt
          echo "head=$GITHUB_SHA" >> diagnostics/segment_demons_v8.txt
          echo 'beam=12288 backs=480,960,1920,3840 rounds=5' >> diagnostics/segment_demons_v8.txt
          prog() { awk '$1=="progress"{print $2; exit}' "$1"; }
          better() { python3 - "$1" "$2" <<'PY'
          import sys
          print(1 if float(sys.argv[1]) > float(sys.argv[2]) + 1e-7 else 0)
          PY
          }
          repair_one() {
            NUM="$1"; NAME="$2"; KEY="$3"
            python3 tools/gmd_to_gdl.py "levels/${NUM}.gmd" -o "/tmp/segv8/${KEY}.gdl" --name "$NAME" >/dev/null
            cp "diagnostics/demons_v8/${KEY}.macro" "/tmp/segv8/${KEY}.best.macro"
            BEST=$(prog "/tmp/segv8/${KEY}.best.macro")
            echo "===== $NAME start=$BEST =====" | tee -a diagnostics/segment_demons_v8.txt
            for ROUND in 1 2 3 4 5; do
              ROUND_BEST="$BEST"; ROUND_FILE=''
              for BACK in 480 960 1920 3840; do
                OUT="/tmp/segv8/${KEY}.r${ROUND}.b${BACK}.macro"
                set +e
                ./build/gdlearn solve "/tmp/segv8/${KEY}.gdl" --beam 12288 --widen 0 --max-frames 36000 --stall 9000 --prefix-macro "/tmp/segv8/${KEY}.best.macro" --prefix-back "$BACK" --out "$OUT" > "/tmp/segv8/${KEY}.r${ROUND}.b${BACK}.log" 2>&1
                RC=$?
                set -e
                if [ -f "$OUT" ]; then
                  P=$(prog "$OUT")
                  echo "round=$ROUND back=$BACK rc=$RC progress=$P" | tee -a diagnostics/segment_demons_v8.txt
                  if [ "$(better "$P" "$ROUND_BEST")" = 1 ]; then ROUND_BEST="$P"; ROUND_FILE="$OUT"; fi
                else echo "round=$ROUND back=$BACK rc=$RC no_macro" | tee -a diagnostics/segment_demons_v8.txt; fi
              done
              if [ -z "$ROUND_FILE" ]; then echo "round=$ROUND no improvement" | tee -a diagnostics/segment_demons_v8.txt; break; fi
              cp "$ROUND_FILE" "/tmp/segv8/${KEY}.best.macro"; BEST="$ROUND_BEST"
              echo "round=$ROUND promoted=$BEST" | tee -a diagnostics/segment_demons_v8.txt
              python3 - "$BEST" <<'PY' && break || true
          import sys
          raise SystemExit(0 if float(sys.argv[1]) >= 0.999999 else 1)
          PY
            done
            cp "/tmp/segv8/${KEY}.best.macro" "diagnostics/demons_v8_segmented/${KEY}.macro"
            echo "FINAL $KEY $BEST" | tee -a diagnostics/segment_demons_v8.txt
          }
          repair_one 14 Clubstep clubstep
          repair_one 18 'Theory of Everything 2' toe2
          repair_one 20 Deadlocked deadlocked
          cat diagnostics/segment_demons_v8.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add diagnostics/segment_demons_v8.txt diagnostics/demons_v8_segmented/*.macro
          git commit -m 'record segmented v8 demon repairs' || true
          git pull --rebase origin agent/gdlearn2-physics-v6
          git push
