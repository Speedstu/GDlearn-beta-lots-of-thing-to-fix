name: gdlearn2 bootstrap diagnostic

on:
  push:
    branches:
      - agent/gdlearn2-replace

permissions:
  contents: write

jobs:
  bootstrap:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct bootstrap archive
        shell: bash
        run: |
          set -euo pipefail
          {
            cat .bootstrap/part-00 .bootstrap/repair-00tail
            cat .bootstrap/part-01 .bootstrap/part-02 .bootstrap/part-03
            cat .bootstrap/repair-04a .bootstrap/repair-04b
            cat .bootstrap/part-05
            tr -d '[:space:]' < .bootstrap/part-06
            cat .bootstrap/part-07 .bootstrap/part-08
            cat .bootstrap/part-09 .bootstrap/repair-09tail
            cat .bootstrap/part-10
          } > /tmp/gdlearn2_bootstrap.b64

          B64_BYTES="$(wc -c < /tmp/gdlearn2_bootstrap.b64 | tr -d ' ')"
          B64_SHA="$(sha256sum /tmp/gdlearn2_bootstrap.b64 | awk '{print $1}')"
          printf 'base64_bytes=%s\nbase64_sha256=%s\n' "$B64_BYTES" "$B64_SHA" | tee /tmp/bootstrap_diag.txt

          base64 -d /tmp/gdlearn2_bootstrap.b64 > /tmp/gdlearn2_bootstrap.zip
          ZIP_BYTES="$(wc -c < /tmp/gdlearn2_bootstrap.zip | tr -d ' ')"
          ZIP_SHA="$(sha256sum /tmp/gdlearn2_bootstrap.zip | awk '{print $1}')"
          printf 'zip_bytes=%s\nzip_sha256=%s\n' "$ZIP_BYTES" "$ZIP_SHA" | tee -a /tmp/bootstrap_diag.txt

          test "$B64_BYTES" -eq 130384
          test "$ZIP_SHA" = '33eec6c0b42e1142ab3a880ca593cc96e4dc593cc4e0239b91e52976dcd64eda'
          unzip -t /tmp/gdlearn2_bootstrap.zip

      - name: Replace legacy project with reconstructed gdlearn2
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/raw_levels /tmp/newsrc
          cp -a levels/. /tmp/raw_levels/
          unzip -q /tmp/gdlearn2_bootstrap.zip -d /tmp/newsrc

          find . -mindepth 1 -maxdepth 1 \
            ! -name .git \
            ! -name .github \
            -exec rm -rf {} +

          cp -a /tmp/newsrc/. .
          mkdir -p levels
          cp -a /tmp/raw_levels/. levels/
          cp /tmp/bootstrap_diag.txt BOOTSTRAP_DIAG.txt
          rm -f README_TEMP_TEST.txt

      - name: Commit reconstructed source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'bootstrap gdlearn2 source from validated payload'
          git push origin HEAD:agent/gdlearn2-replace
