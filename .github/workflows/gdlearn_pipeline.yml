name: gdlearn2 CI

on:
  push:
    branches:
      - agent/gdlearn2-replace
      - main
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Configure Release
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build -j"$(nproc)"
      - name: Core selftest
        run: ./build/gdlearn selftest
      - name: Short throughput benchmark
        run: ./build/gdlearn bench --steps 1000000
